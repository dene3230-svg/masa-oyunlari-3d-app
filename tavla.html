        }
        [-0.47, 0.47].forEach((fz) => {
          const finial = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), brassMat);
          finial.position.set(0, 0.044, fz);
          hg.add(finial);
        });

        return hg;
      }

      [-BOARD_D / 2 + 0.92, BOARD_D / 2 - 0.92].forEach((hz) => {
        boardGroup.add(buildOrnateBrassHinge(hz));
      });

      // Right-Side Bear-Off Trays (Bottom = Human White, Top = Bot Black)
      const trayFloor = new THREE.Mesh(new THREE.BoxGeometry(TRAY_W, 0.3, BOARD_D), mahoganyMat);
      trayFloor.position.set(TRAY_CX, -0.17, 0);
      trayFloor.receiveShadow = !isSoftwareGl;
      boardGroup.add(trayFloor);

      // Divider separating Right Wing from Bear-Off Tray
      const trayDivider = new THREE.Mesh(
        new THREE.BoxGeometry(FRAME_T * 0.55, FRAME_H - 0.12, BOARD_D),
        walnutMat
      );
      trayDivider.position.set(BAR_W / 2 + WING_W + FRAME_T * 0.275, (FRAME_H - 0.12) / 2 - 0.32, 0);
      trayDivider.castShadow = !isSoftwareGl;
      trayDivider.receiveShadow = !isSoftwareGl;
      boardGroup.add(trayDivider);

      // Center horizontal divider splitting Human vs Bot Bear-Off Tray
      const trayMidSplit = new THREE.Mesh(new THREE.BoxGeometry(TRAY_W, 0.38, 0.24), walnutMat);
      trayMidSplit.position.set(TRAY_CX, 0.1, 0);
      trayMidSplit.castShadow = !isSoftwareGl;
      trayMidSplit.receiveShadow = !isSoftwareGl;
      boardGroup.add(trayMidSplit);

      // Outer Walnut Box Frame Walls (tall walls for authentic interior shadows)
      const leftEdgeX = LEFT_WING_CX - WING_W / 2 - FRAME_T / 2;
      const rightEdgeX = TRAY_CX + TRAY_W / 2 + FRAME_T / 2;
      const totalSpanX = rightEdgeX - leftEdgeX + FRAME_T;
      const centerSpanX = (leftEdgeX + rightEdgeX) / 2;
      const wallTopY = FRAME_H - 0.32;

      const walls = [
        [totalSpanX, FRAME_H, FRAME_T, centerSpanX, FRAME_H / 2 - 0.32, -BOARD_D / 2 - FRAME_T / 2],
        [totalSpanX, FRAME_H, FRAME_T, centerSpanX, FRAME_H / 2 - 0.32, BOARD_D / 2 + FRAME_T / 2],
        [FRAME_T, FRAME_H, BOARD_D, leftEdgeX, FRAME_H / 2 - 0.32, 0],
        [FRAME_T, FRAME_H, BOARD_D, rightEdgeX, FRAME_H / 2 - 0.32, 0],
      ];
      walls.forEach(([w, h, d, x, y, z]) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), walnutMat);
        m.position.set(x, y, z);
        m.castShadow = !isSoftwareGl;
        m.receiveShadow = !isSoftwareGl;
        boardGroup.add(m);
      });

      // Fine brass top-rim marquetry inlay running along the top of the walnut frame
      const trimTopBars = [
        [totalSpanX - 0.36, 0.014, 0.045, centerSpanX, wallTopY + 0.004, -BOARD_D / 2 - FRAME_T / 2],
        [totalSpanX - 0.36, 0.014, 0.045, centerSpanX, wallTopY + 0.004, BOARD_D / 2 + FRAME_T / 2],
        [0.045, 0.014, BOARD_D + FRAME_T - 0.36, leftEdgeX, wallTopY + 0.004, 0],
        [0.045, 0.014, BOARD_D + FRAME_T - 0.36, rightEdgeX, wallTopY + 0.004, 0],
      ];
      trimTopBars.forEach(([w, h, d, x, y, z]) => {
        const strip = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), brassMat);
        strip.position.set(x, y, z);
        boardGroup.add(strip);
      });

      // Brass corner brackets on all 4 corners of the walnut box
      const cornerCoords = [
        [leftEdgeX - FRAME_T / 2, -BOARD_D / 2 - FRAME_T],
        [rightEdgeX + FRAME_T / 2, -BOARD_D / 2 - FRAME_T],
        [leftEdgeX - FRAME_T / 2, BOARD_D / 2 + FRAME_T],
        [rightEdgeX + FRAME_T / 2, BOARD_D / 2 + FRAME_T],
      ];
      cornerCoords.forEach(([cx, cz]) => {
        const sx = cx < 0 ? 1 : -1;
        const sz = cz < 0 ? 1 : -1;
        const capA = new THREE.Mesh(new THREE.BoxGeometry(0.62, FRAME_H + 0.02, 0.06), brassMat);
        capA.position.set(cx + sx * 0.28, FRAME_H / 2 - 0.32, cz + sz * 0.01);
        boardGroup.add(capA);
        const capB = new THREE.Mesh(new THREE.BoxGeometry(0.06, FRAME_H + 0.02, 0.62), brassMat);
        capB.position.set(cx + sx * 0.01, FRAME_H / 2 - 0.32, cz + sz * 0.28);
        boardGroup.add(capB);
      });

      // Decorative brass clasps on front rail
      [-3.1, 3.1].forEach((cx) => {
        const claspBase = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.28, 0.06), darkBrassMat);
        claspBase.position.set(cx, 0.14, BOARD_D / 2 + FRAME_T + 0.02);
        boardGroup.add(claspBase);
        const claspLatch = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.36, 0.09), brassMat);
        claspLatch.position.set(cx, 0.16, BOARD_D / 2 + FRAME_T + 0.05);
        boardGroup.add(claspLatch);
      });

      // Dark wood lounge table plane beneath the backgammon box + soft grounded contact shadow
      const tableUnder = new THREE.Mesh(
        new THREE.PlaneGeometry(54, 54),
        new THREE.MeshStandardMaterial({ color: 0x0b0910, roughness: 0.86, metalness: 0.06 })
      );
      tableUnder.rotation.x = -Math.PI / 2;
      tableUnder.position.y = -0.34;
      tableUnder.receiveShadow = !isSoftwareGl;
      scene.add(tableUnder);

      const contactShadowTex = (() => {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(128, 128, 48, 128, 128, 128);
        g.addColorStop(0, 'rgba(0,0,0,0.68)');
        g.addColorStop(0.68, 'rgba(0,0,0,0.34)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        return makeTex(c);
      })();
      const boxContactShadow = new THREE.Mesh(
        new THREE.PlaneGeometry(totalSpanX + 3.8, BOARD_D + FRAME_T * 2 + 3.4),
        new THREE.MeshBasicMaterial({ map: contactShadowTex, transparent: true, depthWrite: false, opacity: 0.72 })
      );
      boxContactShadow.rotation.x = -Math.PI / 2;
      boxContactShadow.position.set(centerSpanX, -0.325, 0);
      scene.add(boxContactShadow);

      /* ------------------ POINT & TRAY 3D COORDINATE MAPPING ------------------ */
      const CHECKER_R = 0.4;
      const CHECKER_H = 0.16;

      function getPointGeometryInfo(pointIdx) {
        // 0..5: Bottom-Right (right -> left)
        // 6..11: Bottom-Left (right -> left)
        // 12..17: Top-Left (left -> right)
        // 18..23: Top-Right (left -> right)
        if (pointIdx <= 5) {
          const colFromRight = pointIdx;
          const x = RIGHT_WING_CX + WING_W / 2 - (colFromRight + 0.5) * COL_W;
          return { x, baseZ: BOARD_D / 2 - 0.46, dirZ: -1 };
        }
        if (pointIdx <= 11) {
          const colFromRight = pointIdx - 6;
          const x = LEFT_WING_CX + WING_W / 2 - (colFromRight + 0.5) * COL_W;
          return { x, baseZ: BOARD_D / 2 - 0.46, dirZ: -1 };
        }
        if (pointIdx <= 17) {
          const colFromLeft = pointIdx - 12;
          const x = LEFT_WING_CX - WING_W / 2 + (colFromLeft + 0.5) * COL_W;
          return { x, baseZ: -BOARD_D / 2 + 0.46, dirZ: 1 };
        }
        const colFromLeft = pointIdx - 18;
        const x = RIGHT_WING_CX - WING_W / 2 + (colFromLeft + 0.5) * COL_W;
        return { x, baseZ: -BOARD_D / 2 + 0.46, dirZ: 1 };
      }

      function getCheckerWorldPos(location, stackIndex, player) {
        if (location === 'bar') {
          const signZ = player === HUMAN ? 1 : -1;
          const z = signZ * (0.95 + Math.min(stackIndex, 3) * 0.72);
          const y = BAR_TOP_Y + CHECKER_H / 2 + (stackIndex >= 4 ? (stackIndex - 3) * CHECKER_H : 0);
          return new THREE.Vector3(0, y, z);
        }
        if (location === 'off') {
          // Neatly stacked flat/layered in right bear-off tray
          const isHuman = player === HUMAN;
          const baseZ = isHuman ? 0.55 : -0.55;
          const dir = isHuman ? 1 : -1;
          const slot = stackIndex % 15;
          const z = baseZ + dir * (slot * 0.24);
          return new THREE.Vector3(TRAY_CX, 0.04 + CHECKER_R * 0.85, z);
        }

        const info = getPointGeometryInfo(location);
        // Cap visible row length at 5 checkers so triangles stay super clean!
        const rowSlot = Math.min(stackIndex, 4);
        const layer = stackIndex >= 5 ? Math.min(stackIndex - 4, 2) : 0;
        const x = info.x;
        const z = info.baseZ + info.dirZ * (rowSlot * 0.79);
        const y = 0.005 + CHECKER_H / 2 + layer * (CHECKER_H * 0.82);
        return new THREE.Vector3(x, y, z);
      }

      /* ------------------ CARVED SEDEF & ABANOZ 3D CHECKER FACTORY (LATHE) ------------------ */
      // Sculpted Ottoman checker profile with grooved outer grip rim and recessed concave finger dish
      const checkerProfile = [
        new THREE.Vector2(0.01, -CHECKER_H / 2),
        new THREE.Vector2(CHECKER_R * 0.92, -CHECKER_H / 2),
        new THREE.Vector2(CHECKER_R * 0.99, -CHECKER_H * 0.36),
        new THREE.Vector2(CHECKER_R * 0.95, -CHECKER_H * 0.12),
        new THREE.Vector2(CHECKER_R, CHECKER_H * 0.08),
        new THREE.Vector2(CHECKER_R * 0.98, CHECKER_H * 0.36),
        new THREE.Vector2(CHECKER_R * 0.88, CHECKER_H * 0.5),
        new THREE.Vector2(CHECKER_R * 0.72, CHECKER_H * 0.5),
        new THREE.Vector2(CHECKER_R * 0.6, CHECKER_H * 0.34),
        new THREE.Vector2(CHECKER_R * 0.35, CHECKER_H * 0.18),
        new THREE.Vector2(0.01, CHECKER_H * 0.14),
      ];
      const checkerGeo = new THREE.LatheGeometry(checkerProfile, 44);
      const checkerTopGeo = new THREE.CircleGeometry(CHECKER_R * 0.89, 36);
      const checkerRimRingGeo = new THREE.TorusGeometry(CHECKER_R * 0.975, 0.012, 8, 36);

      const whiteCheckerPBR = createCheckerPBRSet(true);
      const blackCheckerPBR = createCheckerPBRSet(false);

      const whiteBodyMat = new THREE.MeshPhysicalMaterial({
        color: 0xf3ebd9,
        roughness: 0.68,
        metalness: 0.05,
        clearcoat: 0,
        iridescence: 0.12,
        iridescenceIOR: 1.35,
        iridescenceThicknessRange: [180, 400],
        specularIntensity: 0.3,
        envMapIntensity: 0.32,
      });
      const whiteTopMat = new THREE.MeshPhysicalMaterial({
        map: whiteCheckerPBR.map,
        bumpMap: whiteCheckerPBR.bumpMap,
        bumpScale: 0.02,
        roughness: 0.68,
        metalness: 0.05,
        clearcoat: 0,
        iridescence: 0.14,
        iridescenceIOR: 1.36,
        iridescenceThicknessRange: [200, 420],
        specularIntensity: 0.3,
        envMapIntensity: 0.32,
      });

      const blackBodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x1a0c10,
        roughness: 0.68,
        metalness: 0.08,
        clearcoat: 0,
        specularIntensity: 0.32,
        envMapIntensity: 0.35,
      });
      const blackTopMat = new THREE.MeshPhysicalMaterial({
        map: blackCheckerPBR.map,
        bumpMap: blackCheckerPBR.bumpMap,
        bumpScale: 0.022,
        roughness: 0.68,
        metalness: 0.08,
        clearcoat: 0,
        specularIntensity: 0.32,
        envMapIntensity: 0.35,
      });

      function createCheckerMesh(player) {
        const isWhite = player === HUMAN;
        const g = new THREE.Group();

        const body = new THREE.Mesh(checkerGeo, isWhite ? whiteBodyMat : blackBodyMat);
        body.castShadow = !isSoftwareGl;
        body.receiveShadow = !isSoftwareGl;
        g.add(body);

        // Carved inlaid brass equatorial accent bead around checker rim
        const rimBead = new THREE.Mesh(checkerRimRingGeo, isWhite ? brassMat : darkBrassMat);
        rimBead.rotation.x = Math.PI / 2;
        rimBead.position.y = -CHECKER_H * 0.12;
        g.add(rimBead);

        const cap = new THREE.Mesh(checkerTopGeo, isWhite ? whiteTopMat : blackTopMat);
        cap.rotation.x = -Math.PI / 2;
        cap.position.y = CHECKER_H * 0.495;
        cap.receiveShadow = !isSoftwareGl;
        g.add(cap);

        // Playable/Selected glowing halo ring around checker base
        const halo = new THREE.Mesh(
          new THREE.RingGeometry(CHECKER_R * 1.02, CHECKER_R * 1.19, 32),
          new THREE.MeshBasicMaterial({
            color: 0xf3d06b,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
          })
        );
        halo.rotation.x = -Math.PI / 2;
        halo.position.y = -CHECKER_H / 2 + 0.012;
        g.add(halo);
        g.userData.halo = halo;
        g.userData.player = player;

        return g;
      }

      /* ------------------ INTERACTIVE HIT TARGETS & DESTINATION RINGS ------------------ */
      const pointHitMeshes = [];
      const pointTargetRings = [];

      for (let p = 0; p < 24; p++) {
        const info = getPointGeometryInfo(p);
        const midZ = info.baseZ + info.dirZ * 1.65;

        // Invisible clickable column covering the whole triangle
        const hit = new THREE.Mesh(
          new THREE.PlaneGeometry(COL_W * 0.94, 3.85),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        hit.rotation.x = -Math.PI / 2;
        hit.position.set(info.x, 0.08, midZ);
        hit.userData = { kind: 'point', point: p };
        scene.add(hit);
        pointHitMeshes.push(hit);

        // Luminous destination highlight ring
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.32, 0.47, 32),
          new THREE.MeshBasicMaterial({
            color: 0x34d399,
            transparent: true,
            opacity: 0,
            side: THREE.DoubleSide,
            depthWrite: false,
          })
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(info.x, 0.04, info.baseZ);
        ring.userData = { kind: 'point', point: p };
        scene.add(ring);
        pointTargetRings.push(ring);
      }

      // Clickable Bar target for Human
      const barHitMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(BAR_W * 1.1, BOARD_D * 0.45),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      barHitMesh.rotation.x = -Math.PI / 2;
      barHitMesh.position.set(0, 0.42, BOARD_D * 0.22);
      barHitMesh.userData = { kind: 'bar' };
      scene.add(barHitMesh);

      // Clickable Bear-Off target & highlight ring for Human (Bottom-Right tray)
      const bearOffHitMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(TRAY_W * 1.1, BOARD_D * 0.46),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      bearOffHitMesh.rotation.x = -Math.PI / 2;
      bearOffHitMesh.position.set(TRAY_CX, 0.25, BOARD_D * 0.24);
      bearOffHitMesh.userData = { kind: 'off' };
      scene.add(bearOffHitMesh);

      const bearOffGlow = new THREE.Mesh(
        new THREE.RingGeometry(0.38, 0.56, 32),
        new THREE.MeshBasicMaterial({
          color: 0xf3d06b,
          transparent: true,
          opacity: 0,
          side: THREE.DoubleSide,
          depthWrite: false,
        })
      );
      bearOffGlow.rotation.x = -Math.PI / 2;
      bearOffGlow.position.set(TRAY_CX, 0.16, 2.2);
      scene.add(bearOffGlow);

      /* ------------------ 3D DICE WITH EDGE-LAUNCH DAMPED-BOUNCE PHYSICS ------------------ */
      // Face indices: +X:3, -X:4, +Y:1, -Y:6, +Z:2, -Z:5
      const DIE_SIZE = 0.58;
      const dieMaterials = [3, 4, 1, 6, 2, 5].map((v) => {
        const pbr = createDieFacePBR(v);
        return new THREE.MeshPhysicalMaterial({
          map: pbr.map,
          bumpMap: pbr.bumpMap,
          bumpScale: 0.024,
          roughness: 0.68,
          metalness: 0.04,
          clearcoat: 0,
          specularIntensity: 0.3,
          envMapIntensity: 0.32,
        });
      });

      function getFaceUpQuaternion(value, yawAngle) {
        const qFace = new THREE.Quaternion();
        const euler = new THREE.Euler();
        switch (value) {
          case 1:
            euler.set(0, 0, 0);
            break;
          case 6:
            euler.set(Math.PI, 0, 0);
            break;
          case 2:
            euler.set(-Math.PI / 2, 0, 0);
            break;
          case 5:
            euler.set(Math.PI / 2, 0, 0);
            break;
          case 3:
            euler.set(0, 0, Math.PI / 2);
            break;
          case 4:
            euler.set(0, 0, -Math.PI / 2);
            break;
        }
        qFace.setFromEuler(euler);
        const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yawAngle);
        return qYaw.multiply(qFace);
      }

      const diceMeshes = [0, 1].map(() => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(DIE_SIZE, DIE_SIZE, DIE_SIZE), dieMaterials);
        mesh.castShadow = !isSoftwareGl;
        mesh.receiveShadow = !isSoftwareGl;
        mesh.visible = false;
        scene.add(mesh);
        return mesh;
      });

      const diceAnim = {
        active: false,
        elapsed: 0,
        duration: 1.08,
        onDone: null,
        items: [],
      };

      function launch3DDice(d1, d2, forPlayer, onDone) {
        const isHuman = forPlayer === HUMAN;
        const wingX = isHuman ? RIGHT_WING_CX : LEFT_WING_CX;
        // Launch dynamically from the outer wooden box rail inward across the playing field
        const railX = isHuman
          ? RIGHT_WING_CX + WING_W / 2 + 0.32
          : LEFT_WING_CX - WING_W / 2 - 0.32;
        const vals = [d1, d2];

        diceAnim.active = true;
        diceAnim.elapsed = 0;
        diceAnim.duration = 1.08;
        diceAnim.onDone = onDone;
        diceAnim.items = vals.map((val, idx) => {
          const mesh = diceMeshes[idx];
          mesh.visible = true;
          const startPos = new THREE.Vector3(
            railX + (isHuman ? 0.25 : -0.25) * idx,
            wallTopY + 1.55 + idx * 0.38,
            (isHuman ? 2.55 : -2.55) + (idx === 0 ? -0.65 : 0.72)
          );
          const endPos = new THREE.Vector3(
            wingX + (idx === 0 ? -0.82 : 0.84) + (Math.random() - 0.5) * 0.34,
            DIE_SIZE / 2 + 0.006,
            (idx === 0 ? -0.44 : 0.46) + (Math.random() - 0.5) * 0.32
          );
          // Slight curved mid-bounce waypoint to emulate glancing roll across the wood
          const midPos = new THREE.Vector3(
            THREE.MathUtils.lerp(startPos.x, endPos.x, 0.58) + (isHuman ? -0.35 : 0.35),
            DIE_SIZE / 2 + 0.006,
            THREE.MathUtils.lerp(startPos.z, endPos.z, 0.52) + (idx === 0 ? -0.45 : 0.45)
          );
          const endQuat = getFaceUpQuaternion(val, (Math.random() - 0.5) * 1.15);
          const spinAxis = new THREE.Vector3(
            (isHuman ? -1 : 1) * (0.65 + Math.random() * 0.55),
            0.35 + Math.random() * 0.5,
            (Math.random() > 0.5 ? 1 : -1) * (0.55 + Math.random() * 0.6)
          ).normalize();
          return {
            mesh,
            startPos,
            midPos,
            endPos,
            endQuat,
            spinAxis,
            totalSpins: Math.PI * (5.2 + idx * 1.3 + Math.random() * 1.4),
            delay: idx * 0.065,
            bouncesHit: [false, false, false, false],
          };
        });
      }

      /* ------------------ IMPACT SHOCKWAVE RINGS & SPARK FX ------------------ */
      const impactFXList = [];
      const impactRingGeo = new THREE.RingGeometry(0.28, 0.48, 36);
      const impactOuterRingGeo = new THREE.RingGeometry(0.42, 0.5, 36);
      const impactSparkGeo = new THREE.SphereGeometry(0.042, 8, 6);

      function spawnImpactRing(worldPos, colorHex = 0xf43f5e, scaleBoost = 1.0, heavyBurst = false, surfaceY = null) {
        const group = new THREE.Group();
        const ringY = surfaceY !== null ? surfaceY : Math.max(0.022, worldPos.y - CHECKER_H * 0.36);
        group.position.set(worldPos.x, ringY, worldPos.z);

        const coreMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: heavyBurst ? 0.96 : 0.72,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const coreRing = new THREE.Mesh(impactRingGeo, coreMat);
        coreRing.rotation.x = -Math.PI / 2;
        group.add(coreRing);

        let outerRing = null;
        let outerMat = null;
        if (heavyBurst) {
          outerMat = new THREE.MeshBasicMaterial({
            color: 0xff9eae,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false,
          });
          outerRing = new THREE.Mesh(impactOuterRingGeo, outerMat);
          outerRing.rotation.x = -Math.PI / 2;
          outerRing.position.y = 0.015;
          group.add(outerRing);
        }

        const sparkCount = heavyBurst ? 14 : 6;
        const sparks = [];
        for (let i = 0; i < sparkCount; i++) {
          const sMat = new THREE.MeshBasicMaterial({
            color: heavyBurst && i % 2 === 0 ? 0xffb3c1 : colorHex,
            transparent: true,
            opacity: heavyBurst ? 0.95 : 0.65,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          const sp = new THREE.Mesh(impactSparkGeo, sMat);
          const ang = (i / sparkCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
          const spd = (heavyBurst ? 1.8 : 0.95) * (0.7 + Math.random() * 0.65) * scaleBoost;
          sp.position.set(Math.cos(ang) * 0.18, 0.04, Math.sin(ang) * 0.18);
          group.add(sp);
          sparks.push({
            mesh: sp,
            mat: sMat,
            vx: Math.cos(ang) * spd,
            vy: (heavyBurst ? 2.1 : 1.05) + Math.random() * (heavyBurst ? 1.4 : 0.55),
            vz: Math.sin(ang) * spd,
          });
        }

        scene.add(group);
        impactFXList.push({
          group,
          coreRing,
          coreMat,
          outerRing,
          outerMat,
          sparks,
          scaleBoost,
          heavyBurst,
          elapsed: 0,
          duration: heavyBurst ? 0.64 : 0.42,
        });
      }

      /* ------------------ CHECKERS SCENE POOL, HIGH-ARC FLIGHTS & SPRING BOUNCES ------------------ */
      const checkersContainer = new THREE.Group();
      scene.add(checkersContainer);

      const badgesContainer = new THREE.Group();
      scene.add(badgesContainer);

      const activeArcs = []; // { mesh, start, end, elapsed, duration, arcHeight, isBearOff, isHitLaunch, spinAxis, onLand }
      const landingBounces = []; // { loc, player, elapsed, duration, amp }
      const flyingBarHidden = { [HUMAN]: 0, [BOT]: 0 };
      let boardCheckerVisuals = []; // { mesh, loc, player, isTop, baseY }

      function clearFlightFX() {
        while (activeArcs.length > 0) {
          const a = activeArcs.pop();
          scene.remove(a.mesh);
        }
        landingBounces.length = 0;
        flyingBarHidden[HUMAN] = 0;
        flyingBarHidden[BOT] = 0;
      }

      function triggerLandingBounce(loc, player, amp = 0.24) {
        landingBounces.push({ loc, player, elapsed: 0, duration: 0.28, amp });
      }

      function rebuildCheckers3D() {
        // Clear static checkers & badges
        while (checkersContainer.children.length > 0) {
          checkersContainer.remove(checkersContainer.children[0]);
        }
        while (badgesContainer.children.length > 0) {
          badgesContainer.remove(badgesContainer.children[0]);
        }
        boardCheckerVisuals = [];

        const st = match.state;

        // 24 points
        for (let p = 0; p < 24; p++) {
          const val = st.points[p];
          if (val === 0) continue;
          const player = val > 0 ? HUMAN : BOT;
          const count = Math.abs(val);
          const renderCount = Math.min(count, 5);

          for (let i = 0; i < renderCount; i++) {
            const mesh = createCheckerMesh(player);
            const pos = getCheckerWorldPos(p, i, player);
            mesh.position.copy(pos);
            mesh.userData.loc = p;
            mesh.userData.isTop = i === renderCount - 1;
            checkersContainer.add(mesh);
            boardCheckerVisuals.push({ mesh, loc: p, player, isTop: i === renderCount - 1, baseY: pos.y });
          }

          // Numeric stack count badge when > 5 checkers occupy the same point
          if (count > 5) {
            const topPos = getCheckerWorldPos(p, 4, player);
            const badge = new THREE.Mesh(
              new THREE.PlaneGeometry(0.48, 0.48),
              new THREE.MeshBasicMaterial({
                map: getStackBadgeTex(count),
                transparent: true,
                depthWrite: false,
              })
            );
            badge.rotation.x = -Math.PI / 2;
            badge.position.set(topPos.x, topPos.y + CHECKER_H / 2 + 0.03, topPos.z);
            badgesContainer.add(badge);
          }
        }

        // Bar checkers (subtract any victim checker currently spinning mid-air toward the bar)
        [HUMAN, BOT].forEach((player) => {
          const visibleBarCount = Math.max(0, st.bar[player] - flyingBarHidden[player]);
          for (let i = 0; i < visibleBarCount; i++) {
            const mesh = createCheckerMesh(player);
            const pos = getCheckerWorldPos('bar', i, player);
            mesh.position.copy(pos);
            mesh.userData.loc = 'bar';
            mesh.userData.isTop = i === visibleBarCount - 1;
            checkersContainer.add(mesh);
            boardCheckerVisuals.push({ mesh, loc: 'bar', player, isTop: i === visibleBarCount - 1, baseY: pos.y });
          }
        });

        // Borne-off checkers stacked neatly on edge inside right tray
        [HUMAN, BOT].forEach((player) => {
          const count = st.off[player];
          for (let i = 0; i < count; i++) {
            const mesh = createCheckerMesh(player);
            const pos = getCheckerWorldPos('off', i, player);
            mesh.position.copy(pos);
            mesh.rotation.x = Math.PI / 2; // Standing cleanly on edge inside tray!
            mesh.userData.loc = 'off';
            checkersContainer.add(mesh);
            boardCheckerVisuals.push({ mesh, loc: 'off', player, isTop: i === count - 1, baseY: pos.y });
          }
        });

        updateSelectionHighlights();
      }

      /**
       * Launches a hit opponent checker spinning high into the air toward the central Bar
       * with red impact rings on strike and on bar touchdown.
       */
      function launchHitVictimToBar(victimPlayer, hitPointIdx, barSlotIdx) {
        const startPos = getCheckerWorldPos(hitPointIdx, 0, victimPlayer);
        const endPos = getCheckerWorldPos('bar', barSlotIdx, victimPlayer);

        // Crimson shockwave ring at the struck point
        spawnImpactRing(startPos, 0xf43f5e, 1.4, true);

        flyingBarHidden[victimPlayer]++;
        const victimMesh = createCheckerMesh(victimPlayer);
        victimMesh.position.copy(startPos);
        scene.add(victimMesh);

        activeArcs.push({
          mesh: victimMesh,
          start: startPos,
          end: endPos,
          elapsed: 0,
          duration: 0.56,
          arcHeight: 3.15,
          isBearOff: false,
          isHitLaunch: true,
          spinAxis: new THREE.Vector3(0.7, 0.9, 0.55).normalize(),
          onLand: () => {
            scene.remove(victimMesh);
            flyingBarHidden[victimPlayer] = Math.max(0, flyingBarHidden[victimPlayer] - 1);
            sound.playCheckerClack(0.76);
            spawnImpactRing(endPos, 0xf43f5e, 1.05, true);
            rebuildCheckers3D();
            triggerLandingBounce('bar', victimPlayer, 0.28);
          },
        });
      }

      function animateCheckerMove(player, move, stateBefore, onComplete) {
        const fromStackIdx =
          move.from === 'bar'
            ? Math.max(0, stateBefore.bar[player] - 1)
            : Math.max(0, Math.min(Math.abs(stateBefore.points[move.from]) - 1, 4));

        const destCountAfter =
          move.to === 'off'
            ? stateBefore.off[player]
            : move.isHit
              ? 0
              : Math.min(Math.abs(stateBefore.points[move.to]), 4);

        const startPos = getCheckerWorldPos(move.from, fromStackIdx, player);
        const endPos = getCheckerWorldPos(move.to, destCountAfter, player);
        const dist = startPos.distanceTo(endPos);

        const flying = createCheckerMesh(player);
        flying.position.copy(startPos);
        scene.add(flying);

        activeArcs.push({
          mesh: flying,
          start: startPos,
          end: endPos,
          elapsed: 0,
          duration: Math.min(0.46, Math.max(0.32, 0.28 + dist * 0.022)),
          arcHeight: Math.min(2.65, 1.55 + dist * 0.14),
          isBearOff: move.to === 'off',
          isHitLaunch: false,
          spinAxis: null,
          onLand: () => {
            scene.remove(flying);
            if (move.to === 'off') {
              sound.playBearOff();
              spawnImpactRing(endPos, 0xf3d06b, 0.85, false);
            } else if (move.isHit) {
              sound.playHit();
              const victim = -player;
              launchHitVictimToBar(victim, move.to, stateBefore.bar[victim]);
            } else {
              sound.playCheckerClack(player === HUMAN ? 1.04 : 0.92);
              spawnImpactRing(endPos, 0xf3d06b, 0.68, false);
            }
            onComplete();
            triggerLandingBounce(move.to, player, move.isHit ? 0.3 : 0.22);
          },
        });
      }

      /* =========================================================================
       * 5. MATCH FLOW, HUMAN INTERACTION, UNDO & BOT TURN EXECUTION
       * ========================================================================= */
      const match = {
        state: createInitialBoardState(),
        turnStartState: null,
        turn: HUMAN, // HUMAN | BOT
        phase: 'roll', // 'roll' | 'rolling' | 'move' | 'animating' | 'bot' | 'ended'
        rolledDice: [],
        remainingDice: [],
        moveHistory: [],
        selectedFrom: null, // point index (0..23) or 'bar'
        legalMoves: [],
      };

      const toastEl = document.getElementById('toast');
      let toastTimer = null;
      function showToast(msg, kind = 'default') {
        toastEl.textContent = msg;
        toastEl.className = `toast visible ${kind}`;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2500);
      }

      function startNewGame() {
        document.getElementById('end-modal').classList.remove('open');
        clearFlightFX();
        match.state = createInitialBoardState();
        match.turnStartState = null;
        match.turn = HUMAN;
        match.phase = 'roll';
        match.rolledDice = [];
        match.remainingDice = [];
        match.moveHistory = [];
        match.selectedFrom = null;
        match.legalMoves = [];
        diceMeshes.forEach((m) => (m.visible = false));

        rebuildCheckers3D();
        updateHUD();
        showToast('Yeni tavla oyunu başladı! Zar atabilirsin.', 'success');
      }

      function rollDiceFor(player) {
        const d1 = 1 + Math.floor(Math.random() * 6);
        const d2 = 1 + Math.floor(Math.random() * 6);
        const fullDice = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];

        match.rolledDice = fullDice.slice();
        match.remainingDice = fullDice.slice();
        match.turnStartState = cloneState(match.state);
        match.moveHistory = [];
        match.selectedFrom = null;
        match.phase = 'rolling';
        updateHUD();

        launch3DDice(d1, d2, player, () => {
          const isDouble = d1 === d2;
          if (player === HUMAN) {
            match.legalMoves = getValidImmediateMoves(match.state, HUMAN, match.remainingDice);
            if (match.legalMoves.length === 0) {
              match.phase = 'move';
              updateHUD();
              showToast(`${d1}-${d2} geldi, oynanacak hamle yok. Sıra Bota geçiyor.`, 'error');
              setTimeout(() => beginBotTurn(), 1150);
              return;
            }
            match.phase = 'move';
            if (match.state.bar[HUMAN] > 0) {
              match.selectedFrom = 'bar';
            }
            updateHUD();
            updateSelectionHighlights();
            if (isDouble) showToast(`Çift ${d1}-${d1}! 4 hamle hakkın var.`, 'success');
          } else {
            runBotMovesSequence(d1, d2);
          }
        });
      }

      function executeHumanMove(move) {
        const before = cloneState(match.state);
        match.moveHistory.push({ stateBefore: before, dieUsed: move.die, move });

        const dIdx = match.remainingDice.indexOf(move.die);
        if (dIdx !== -1) match.remainingDice.splice(dIdx, 1);

        match.selectedFrom = null;
        match.phase = 'animating';

        // Temporarily decrement source visually before flight
        const midState = cloneState(before);
        if (move.from === 'bar') midState.bar[HUMAN]--;
        else midState.points[move.from] -= HUMAN;
        match.state = midState;
        rebuildCheckers3D();
        updateHUD();

        const finalState = applyMoveToState(before, HUMAN, move);
        animateCheckerMove(HUMAN, move, before, () => {
          match.state = finalState;
          rebuildCheckers3D();

          if (match.state.off[HUMAN] === 15) {
            finishGame(HUMAN);
            return;
          }

          match.legalMoves = getValidImmediateMoves(match.state, HUMAN, match.remainingDice);
          match.phase = 'move';
          if (match.state.bar[HUMAN] > 0 && match.legalMoves.length > 0) {
            match.selectedFrom = 'bar';
          }
          updateHUD();
          updateSelectionHighlights();

          if (match.remainingDice.length > 0 && match.legalMoves.length === 0) {
            showToast('Kalan zar için geçerli hamle yok. Turu tamamlayabilirsin.');
          }
        });
      }

      function undoHumanMove() {
        if (match.turn !== HUMAN || match.phase !== 'move' || match.moveHistory.length === 0) return;
        clearFlightFX();
        const last = match.moveHistory.pop();
        match.state = last.stateBefore;
        match.remainingDice.push(last.dieUsed);
        match.selectedFrom = match.state.bar[HUMAN] > 0 ? 'bar' : null;
        match.legalMoves = getValidImmediateMoves(match.state, HUMAN, match.remainingDice);
        sound.playCheckerClack(1.16);
        rebuildCheckers3D();
        updateHUD();
      }

      function confirmHumanTurn() {
        if (match.turn !== HUMAN || match.phase !== 'move') return;
        if (match.legalMoves.length > 0) {
          sound.playError();
          showToast('Turu bitirmeden önce oynanabilir zarlarını kullanmalısın.', 'error');
          return;
        }
        sound.playCheckerClack(1.1);
        beginBotTurn();
      }

      function beginBotTurn() {
        match.turn = BOT;
        match.phase = 'bot';
        match.selectedFrom = null;
        match.legalMoves = [];
        updateHUD();
        updateSelectionHighlights();
        setTimeout(() => {
          if (match.phase === 'ended') return;
          rollDiceFor(BOT);
        }, 420);
      }

      function runBotMovesSequence(d1, d2) {
        const seq = chooseBestBotSequence(match.state, match.remainingDice);
        if (seq.length === 0) {
          showToast(`Usta Bot ${d1}-${d2} attı, hamle yapamadı. Sıra sende!`);
          setTimeout(() => {
            match.turn = HUMAN;
            match.phase = 'roll';
            match.rolledDice = [];
            match.remainingDice = [];
            updateHUD();
          }, 950);
          return;
        }

        let stepIdx = 0;
        function nextStep() {
          if (match.phase === 'ended') return;
          if (stepIdx >= seq.length) {
            if (match.state.off[BOT] === 15) {
              finishGame(BOT);
              return;
            }
            match.turn = HUMAN;
            match.phase = 'roll';
            match.selectedFrom = null;
            match.legalMoves = [];
            updateHUD();
            updateSelectionHighlights();
            return;
          }

          const move = seq[stepIdx++];
          const before = cloneState(match.state);
          const dIdx = match.remainingDice.indexOf(move.die);
          if (dIdx !== -1) match.remainingDice.splice(dIdx, 1);

          const midState = cloneState(before);
          if (move.from === 'bar') midState.bar[BOT]--;
          else midState.points[move.from] -= BOT;
          match.state = midState;
          rebuildCheckers3D();
          updateHUD();

          const after = applyMoveToState(before, BOT, move);
          animateCheckerMove(BOT, move, before, () => {
            match.state = after;
            rebuildCheckers3D();
            updateHUD();
            if (match.state.off[BOT] === 15) {
              finishGame(BOT);
              return;
            }
            setTimeout(nextStep, 260);
          });
        }

        setTimeout(nextStep, 300);
      }

      function finishGame(winner) {
        match.phase = 'ended';
        match.selectedFrom = null;
        match.legalMoves = [];
        updateHUD();
        updateSelectionHighlights();

        const humanWon = winner === HUMAN;
        const loserOff = humanWon ? match.state.off[BOT] : match.state.off[HUMAN];
        const isMars = loserOff === 0;
        const multiplier = isMars ? 2 : 1;

        const delta = humanWon
          ? Math.round(tableStake * 1.9 * multiplier)
          : -Math.min(playerChips, tableStake * multiplier);

        playerChips = Math.max(0, playerChips + delta);
        writeChips(playerChips, humanWon);

        if (humanWon) sound.playVictory(isMars);
        else sound.playError();

        document.getElementById('end-kicker').textContent = isMars ? 'MARS! (2× ÇİP)' : 'OYUN SONU';
        document.getElementById('end-title').textContent = humanWon
          ? isMars
            ? 'MARS İLE KAZANDIN!'
            : 'Oyunu Kazandın!'
          : isMars
            ? 'Usta Bot Mars Etti!'
            : 'Usta Bot Kazandı';
        document.getElementById('end-desc').textContent = humanWon
          ? isMars
            ? 'Rakip tek pul bile toplayamadan tüm pullarını bitirdin! Ödülün 2 katına çıktı.'
            : 'Tüm 15 pulunu başarıyla topladın ve masa ödülünü kazandın.'
          : isMars
            ? 'Hiç pul toplayamadığın için Mars (2×) cezası uygulandı.'
            : 'Usta Bot tüm pullarını senden önce topladı.';

        document.getElementById('res-human').textContent = `${match.state.off[HUMAN]} / 15`;
        document.getElementById('res-bot').textContent = `${match.state.off[BOT]} / 15`;

        const rewardEl = document.getElementById('reward-val');
        rewardEl.textContent = `${delta >= 0 ? '+' : ''}${fmt(delta)} Çip`;
        rewardEl.className = `reward-val ${delta >= 0 ? 'pos' : 'neg'}`;

        document.getElementById('end-modal').classList.add('open');
      }

      /* ------------------ VISUAL HIGHLIGHTING & RAYCASTING ------------------ */
      function updateSelectionHighlights() {
        const playableFroms = new Set(
          match.turn === HUMAN && match.phase === 'move' ? match.legalMoves.map((m) => m.from) : []
        );

        // Highlight playable & selected human checkers
        for (const rec of boardCheckerVisuals) {
          const halo = rec.mesh.userData.halo;
          if (!halo) continue;
          if (rec.player === HUMAN && rec.isTop && playableFroms.has(rec.loc)) {
            const isSel = match.selectedFrom === rec.loc;
            halo.material.color.setHex(isSel ? 0x34d399 : 0xf3d06b);
            halo.material.opacity = isSel ? 0.95 : 0.62;
          } else {
            halo.material.opacity = 0;
          }
        }

        // Highlight valid destination rings for currently selected source
        const validTargets = new Map();
        if (match.turn === HUMAN && match.phase === 'move' && match.selectedFrom !== null) {
          for (const m of match.legalMoves) {
            if (m.from === match.selectedFrom) {
              // Prefer smallest die if multiple dice reach same destination
              if (!validTargets.has(m.to) || m.die < validTargets.get(m.to).die) {
                validTargets.set(m.to, m);
              }
            }
          }
        }

        for (let p = 0; p < 24; p++) {
          const ring = pointTargetRings[p];
          const mv = validTargets.get(p);
          if (mv) {
            const stackIdx = mv.isHit ? 0 : Math.min(Math.abs(match.state.points[p]), 4);
            const pos = getCheckerWorldPos(p, stackIdx, HUMAN);
            ring.position.set(pos.x, pos.y + CHECKER_H * 0.45, pos.z);
            ring.material.color.setHex(mv.isHit ? 0xf43f5e : 0x34d399);
            ring.material.opacity = 0.9;
          } else {
            ring.material.opacity = 0;
          }
        }

        bearOffGlow.material.opacity = validTargets.has('off') ? 0.92 : 0;
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downX = 0;
      let downY = 0;

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        if (e.button !== 0) return;
        // Ignore if user was orbiting camera
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
        if (match.turn !== HUMAN || match.phase !== 'move') return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const targets = [...pointHitMeshes, barHitMesh, bearOffHitMesh];
        const hits = raycaster.intersectObjects(targets, false);
        if (hits.length === 0) {
          if (match.state.bar[HUMAN] === 0 && match.selectedFrom !== null) {
            match.selectedFrom = null;
            updateSelectionHighlights();
          }
          return;
        }

        const hitData = hits[0].object.userData;
        const clickedLoc = hitData.kind === 'point' ? hitData.point : hitData.kind; // number | 'bar' | 'off'

        // 1. If a source is selected and clicked location is a legal destination -> execute move!
        if (match.selectedFrom !== null) {
          const matchingMoves = match.legalMoves.filter(
            (m) => m.from === match.selectedFrom && m.to === clickedLoc
          );
          if (matchingMoves.length > 0) {
            // Pick smallest die if multiple dice reach same target (e.g., bear off)
            matchingMoves.sort((a, b) => a.die - b.die);
            executeHumanMove(matchingMoves[0]);
            return;
          }
        }

        // 2. Otherwise check if clicked location is a valid source checker to select
        const isPlayableSource = match.legalMoves.some((m) => m.from === clickedLoc);
        if (isPlayableSource) {
          if (match.selectedFrom === clickedLoc) {
            // Convenience: double-click / re-click with only 1 destination moves immediately!
            const fromMoves = match.legalMoves.filter((m) => m.from === clickedLoc);
            const uniqueDests = new Set(fromMoves.map((m) => m.to));
            if (uniqueDests.size === 1) {
              executeHumanMove(fromMoves[0]);
              return;
            }
            if (match.state.bar[HUMAN] === 0) match.selectedFrom = null;
          } else {
            match.selectedFrom = clickedLoc;
            sound.playCheckerClack(1.2);
          }
          updateSelectionHighlights();
        } else if (match.state.bar[HUMAN] > 0) {
          sound.playError();
          showToast('Önce ortadaki bardaki kırık pulunu oyuna sokmalısın!', 'error');
        }
      });

      /* ------------------ HUD UPDATES & BUTTON EVENTS ------------------ */
      function updateHUD() {
        const st = match.state;
        const hRem = 15 - st.off[HUMAN];
        const bRem = 15 - st.off[BOT];
        const hPip = computePipCount(st, HUMAN);
        const bPip = computePipCount(st, BOT);

        document.getElementById('stat-human').classList.toggle('active', match.turn === HUMAN && match.phase !== 'ended');
        document.getElementById('stat-bot').classList.toggle('active', match.turn === BOT && match.phase !== 'ended');

        document.getElementById('meta-human').innerHTML =
          `Kalan: ${hRem} · Pip: ${hPip}${st.bar[HUMAN] > 0 ? `<span class="stat-bar-badge"> · Bar:${st.bar[HUMAN]}</span>` : ''}`;
        document.getElementById('meta-bot').innerHTML =
          `Kalan: ${bRem} · Pip: ${bPip}${st.bar[BOT] > 0 ? `<span class="stat-bar-badge"> · Bar:${st.bar[BOT]}</span>` : ''}`;

        // 2D Dice Display
        const diceHud = document.getElementById('dice-hud');
        if (match.rolledDice.length === 0) {
          diceHud.innerHTML = '<div class="die-2d empty">-</div><div class="die-2d empty">-</div>';
        } else {
          const remCopy = match.remainingDice.slice();
          diceHud.innerHTML = match.rolledDice
            .map((d) => {
              const idx = remCopy.indexOf(d);
              const active = idx !== -1;
              if (active) remCopy.splice(idx, 1);
              return `<div class="die-2d ${active ? '' : 'used'}">${d}</div>`;
            })
            .join('');
        }

        // Turn Banner
        const banner = document.getElementById('turn-banner');
        if (match.phase === 'ended') {
          banner.className = 'turn-banner';
          banner.textContent = 'Oyun tamamlandı.';
        } else if (match.turn === HUMAN) {
          banner.className = 'turn-banner highlight';
          if (match.phase === 'roll') {
            banner.textContent = 'Sıra Sende — "Zar At" butonuna bas';
          } else if (match.phase === 'rolling') {
            banner.textContent = 'Zarlar yuvarlanıyor...';
          } else if (match.legalMoves.length === 0) {
            banner.textContent = 'Hamlelerin tamamlandı — "Turu Tamamla" ile sırayı devret';
          } else if (st.bar[HUMAN] > 0) {
            banner.textContent = 'Kırık Pulun Var! Parlayan yeşil haneye tıklayarak oyuna sok';
          } else if (match.selectedFrom !== null) {
            banner.textContent = 'Hedef hanedeki yeşil/altın halkaya tıkla';
          } else {
            banner.textContent = 'Parlayan pullarından birini seç ve hedefine taşı';
          }
        } else {
          banner.className = 'turn-banner';
          banner.textContent = match.phase === 'rolling' ? 'Usta Bot zar atıyor...' : 'Usta Bot hamlesini düşünüyor...';
        }

        // Buttons enabled state
        document.getElementById('btn-roll').disabled = !(match.turn === HUMAN && match.phase === 'roll');
        document.getElementById('btn-undo').disabled = !(
          match.turn === HUMAN &&
          match.phase === 'move' &&
          match.moveHistory.length > 0
        );
        document.getElementById('btn-confirm').disabled = !(
          match.turn === HUMAN &&
          match.phase === 'move' &&
          match.legalMoves.length === 0
        );
      }

      document.getElementById('btn-roll').addEventListener('click', () => {
        if (match.turn === HUMAN && match.phase === 'roll') {
          rollDiceFor(HUMAN);
        }
      });
      document.getElementById('btn-undo').addEventListener('click', undoHumanMove);
      document.getElementById('btn-confirm').addEventListener('click', confirmHumanTurn);
      document.getElementById('btn-rematch').addEventListener('click', startNewGame);

      // Camera View Preset Toggle (Smooth Damped Transition, cancels if user orbits manually)
      let camMode = 'angled'; // 'angled' | 'top'
      let camPresetActive = false;
      const camGoalPos = new THREE.Vector3();
      const camGoalTarget = new THREE.Vector3(0.3, 0, 0.2);

      controls.addEventListener('start', () => {
        camPresetActive = false;
      });

      function applyCameraPreset(mode) {
        camMode = mode;
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        const narrowPull = aspect < 1.45 ? (1.45 - aspect) * 6.5 : 0;
        if (mode === 'top') {
          camGoalPos.set(0.3, 15.8 + narrowPull, 2.2);
          document.getElementById('cam-label').textContent = '3D Masa Açısı';
        } else {
          camGoalPos.set(0.3, 11.4 + narrowPull * 0.7, 10.6 + narrowPull * 0.7);
          document.getElementById('cam-label').textContent = 'Kuşbakışı';
        }
        camPresetActive = true;
      }

      document.getElementById('btn-cam').addEventListener('click', () => {
        sound.playCheckerClack(1.18);
        applyCameraPreset(camMode === 'angled' ? 'top' : 'angled');
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'v' || e.key === 'V') {
          applyCameraPreset(camMode === 'angled' ? 'top' : 'angled');
        }
      });

      // Sound Toggle
      function syncSoundUI() {
        document.getElementById('ico-on').style.display = sound.enabled ? 'block' : 'none';
        document.getElementById('ico-off').style.display = sound.enabled ? 'none' : 'block';
        document.getElementById('sound-label').textContent = sound.enabled ? 'Ses' : 'Sessiz';
      }
      syncSoundUI();

      document.getElementById('btn-sound').addEventListener('click', () => {
        sound.enabled = !sound.enabled;
        syncSoundUI();
        if (sound.enabled) sound.playCheckerClack(1.15);
      });

      /* =========================================================================
       * 6. RENDER & PHYSICS ANIMATION LOOP (WITH SOFTWARE-WEBGL PACING)
       * ========================================================================= */
      const clock = new THREE.Clock();
      const _qSpin = new THREE.Quaternion();
      const _qTmp = new THREE.Quaternion();
      let frameId = 0;
      let contextLost = false;

      function afterDraw(cb) {
        const gl = renderer.getContext();
        if (gl && typeof gl.fenceSync === 'function') {
          const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
          gl.flush();
          const poll = () => {
            const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
            if (state === gl.UNSIGNALED) frameId = window.setTimeout(poll, 5);
            else {
              if (sync) gl.deleteSync(sync);
              frameId = window.setTimeout(cb, 80);
            }
          };
          frameId = window.setTimeout(poll, 5);
        } else {
          frameId = window.setTimeout(cb, 80);
        }
      }

      let pageHidden = document.hidden;

      function tick() {
        if (contextLost || pageHidden) return;
        const dt = Math.min(clock.getDelta(), 0.08);
        const elapsed = clock.getElapsedTime();

        // Smooth camera preset glide
        if (camPresetActive) {
          camera.position.lerp(camGoalPos, 1 - Math.exp(-6.5 * dt));
          controls.target.lerp(camGoalTarget, 1 - Math.exp(-6.5 * dt));
          if (camera.position.distanceTo(camGoalPos) < 0.05) {
            camPresetActive = false;
          }
        }
        controls.update();

        // Physical damped-bounce 3D dice launched from the wooden rail
        if (diceAnim.active) {
          diceAnim.elapsed += dt;
          let allDone = true;

          diceAnim.items.forEach((it, idx) => {
            const localElapsed = Math.max(0, diceAnim.elapsed - it.delay);
            const dieDur = diceAnim.duration - it.delay;
            const t = Math.min(1, localElapsed / dieDur);
            if (t < 1) allDone = false;

            // Curved quadratic Bezier horizontal glide with wooden friction deceleration
            const hEase = 1 - Math.pow(1 - t, 2.35);
            const inv = 1 - hEase;
            it.mesh.position.x =
              inv * inv * it.startPos.x + 2 * inv * hEase * it.midPos.x + hEase * hEase * it.endPos.x;
            it.mesh.position.z =
              inv * inv * it.startPos.z + 2 * inv * hEase * it.midPos.z + hEase * hEase * it.endPos.z;

            // 4-stage damped bounce curve (energy decays realistically on each wood contact)
            let bounceH = 0;
            if (t < 0.34) {
              // Initial throw arc from the outer box rail
              const lt = t / 0.34;
              bounceH = (1 - lt * lt) * (it.startPos.y - (DIE_SIZE / 2 + 0.006)) + Math.sin(lt * Math.PI) * 0.42;
            } else if (t < 0.62) {
              if (!it.bouncesHit[0]) {
                it.bouncesHit[0] = true;
                sound.playDiceBounce(idx === 0 ? 1.0 : 0.88);
                spawnImpactRing(it.mesh.position, 0xf3d06b, 0.55, false, 0.02);
              }
              const lt = (t - 0.34) / 0.28;
              bounceH = Math.sin(lt * Math.PI) * 1.08;
            } else if (t < 0.81) {
              if (!it.bouncesHit[1]) {
                it.bouncesHit[1] = true;
                sound.playDiceBounce(0.62);
              }
              const lt = (t - 0.62) / 0.19;
              bounceH = Math.sin(lt * Math.PI) * 0.44;
            } else if (t < 0.93) {
              if (!it.bouncesHit[2]) {
                it.bouncesHit[2] = true;
                sound.playDiceBounce(0.36);
              }
              const lt = (t - 0.81) / 0.12;
              bounceH = Math.sin(lt * Math.PI) * 0.15;
            } else {
              if (!it.bouncesHit[3]) {
                it.bouncesHit[3] = true;
                sound.playDiceBounce(0.18);
              }
              // Final damped micro-settle rock
              const lt = (t - 0.93) / 0.07;
              bounceH = Math.sin(lt * Math.PI) * 0.032;
            }
            it.mesh.position.y = DIE_SIZE / 2 + 0.006 + bounceH;

            // Continuous axis tumble that smoothly decelerates into exact target face-up orientation
            if (t < 0.82) {
              const remSpin = Math.pow(1 - t / 0.82, 1.55) * it.totalSpins;
              _qSpin.setFromAxisAngle(it.spinAxis, remSpin);
              _qTmp.copy(it.endQuat).multiply(_qSpin);
              it.mesh.quaternion.copy(_qTmp);
            } else {
              const lockT = (t - 0.82) / 0.18;
              const wobble = Math.sin(lockT * Math.PI * 2.0) * (1 - lockT) * 0.12;
              _qSpin.setFromAxisAngle(it.spinAxis, wobble);
              _qTmp.copy(it.endQuat).multiply(_qSpin);
              it.mesh.quaternion.slerp(_qTmp, Math.min(1, 0.38 + lockT * 0.62));
            }
          });

          if (allDone) {
            diceAnim.items.forEach((it) => {
              it.mesh.position.copy(it.endPos);
              it.mesh.quaternion.copy(it.endQuat);
            });
            diceAnim.active = false;
            const cb = diceAnim.onDone;
            diceAnim.onDone = null;
            if (cb) cb();
          }
        }

        // High-arc parabolic checker flights & spinning hit-to-bar launches
        for (let i = activeArcs.length - 1; i >= 0; i--) {
          const arc = activeArcs[i];
          arc.elapsed += dt;
          const t = Math.min(1, arc.elapsed / arc.duration);
          const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

          arc.mesh.position.lerpVectors(arc.start, arc.end, eased);
          // High graceful parabolic arc: 4 * t * (1 - t) peaks cleanly at t = 0.5
          arc.mesh.position.y += 4 * t * (1 - t) * arc.arcHeight;

          if (arc.isHitLaunch) {
            // Dramatic rapid mid-air spin as the struck checker flies to the central bar
            const spinAngle = (1 - eased) * Math.PI * 6.0;
            _qSpin.setFromAxisAngle(arc.spinAxis, spinAngle);
            arc.mesh.quaternion.copy(_qSpin);
          } else if (arc.isBearOff) {
            arc.mesh.rotation.set(eased * (Math.PI / 2), Math.sin(t * Math.PI) * 0.35, 0);
          } else {
            // Subtle aerodynamic bank & pitch along flight arc
            const dx = arc.end.x - arc.start.x;
            const dz = arc.end.z - arc.start.z;
            const envelope = Math.sin(t * Math.PI);
            arc.mesh.rotation.set(dz * 0.045 * envelope, eased * Math.PI * 0.5, -dx * 0.045 * envelope);
          }

          if (t >= 1) {
            activeArcs.splice(i, 1);
            arc.onLand();
          }
        }

        // Damped spring landing bounce on destination checkers
        for (let i = landingBounces.length - 1; i >= 0; i--) {
          const lb = landingBounces[i];
          lb.elapsed += dt;
          const p = Math.min(1, lb.elapsed / lb.duration);
          const springY = Math.abs(Math.sin(p * Math.PI * 2.0)) * Math.exp(-p * 4.8) * lb.amp;
          const squash = 1 - Math.sin(p * Math.PI) * Math.exp(-p * 5.2) * 0.08;

          for (const rec of boardCheckerVisuals) {
            if (rec.player === lb.player && rec.isTop && rec.loc === lb.loc) {
              if (p < 1) {
                rec.mesh.position.y = rec.baseY + springY;
                rec.mesh.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
              } else {
                rec.mesh.position.y = rec.baseY;
                rec.mesh.scale.set(1, 1, 1);
              }
            }
          }
          if (p >= 1) landingBounces.splice(i, 1);
        }

        // Expanding crimson/gold impact shockwave rings & spark burst particles
        for (let i = impactFXList.length - 1; i >= 0; i--) {
          const fx = impactFXList[i];
          fx.elapsed += dt;
          const p = Math.min(1, fx.elapsed / fx.duration);
          const easeOut = 1 - Math.pow(1 - p, 3);

          const s1 = (0.55 + easeOut * (fx.heavyBurst ? 2.85 : 1.75)) * fx.scaleBoost;
          fx.coreRing.scale.set(s1, s1, 1);
          fx.coreMat.opacity = (fx.heavyBurst ? 0.96 : 0.7) * Math.pow(1 - p, 1.5);

          if (fx.outerRing) {
            const s2 = (0.4 + easeOut * 3.65) * fx.scaleBoost;
            fx.outerRing.scale.set(s2, s2, 1);
            fx.outerMat.opacity = 0.82 * Math.pow(1 - p, 1.8);
          }

          for (let j = 0; j < fx.sparks.length; j++) {
            const sp = fx.sparks[j];
            sp.mesh.position.x += sp.vx * dt;
            sp.mesh.position.y = Math.max(0.01, sp.mesh.position.y + sp.vy * dt);
            sp.mesh.position.z += sp.vz * dt;
            sp.vy -= 7.2 * dt;
            sp.mat.opacity = (fx.heavyBurst ? 0.92 : 0.65) * (1 - p);
            const sc = Math.max(0.01, 1 - p * 0.75);
            sp.mesh.scale.setScalar(sc);
          }

          if (p >= 1) {
            scene.remove(fx.group);
            fx.coreMat.dispose();
            if (fx.outerMat) fx.outerMat.dispose();
            fx.sparks.forEach((sp) => sp.mat.dispose());
            impactFXList.splice(i, 1);
          }
        }

        // Gentle breathing lift on selected checker & destination rings
        const bob = Math.sin(elapsed * 5.2) * 0.04;
        if (match.selectedFrom !== null) {
          for (const rec of boardCheckerVisuals) {
            if (rec.player === HUMAN && rec.isTop && rec.loc === match.selectedFrom) {
              rec.mesh.position.y = rec.baseY + 0.14 + bob;
            }
          }
        }

        renderer.render(scene, camera);

        if (isSoftwareGl) afterDraw(tick);
        else frameId = requestAnimationFrame(tick);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
      });

      document.addEventListener('visibilitychange', () => {
        pageHidden = document.hidden;
        cancelAnimationFrame(frameId);
        clearTimeout(frameId);
        frameId = 0;
        if (!pageHidden && !contextLost) {
          clock.getDelta();
          tick();
        }
      });

      renderer.domElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        contextLost = true;
        cancelAnimationFrame(frameId);
        clearTimeout(frameId);
        frameId = 0;
      });

      renderer.domElement.addEventListener('webglcontextrestored', () => {
        contextLost = false;
        clock.getDelta();
        if (!pageHidden) tick();
      });

      // Boot 3D Tavla!
      applyCameraPreset('angled');
      startNewGame();
      if (!isSoftwareGl) renderer.compile(scene, camera);
      tick();
      })();
    </script>
  </body>
</html>
