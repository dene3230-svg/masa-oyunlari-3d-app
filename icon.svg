<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MASA 3D Uygulama Simgesi">
  <defs>
    <!-- Koyu Lacivert Arka Plan -->
    <radialGradient id="bgNavy" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#152b60" />
      <stop offset="52%" stop-color="#091430" />
      <stop offset="100%" stop-color="#040814" />
    </radialGradient>

    <!-- Merkez Altın Işık Halesi -->
    <radialGradient id="centerGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#f3d06b" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>

    <!-- Metalik Altın Çerçeve ve Yazı Gradyanı -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c4" />
      <stop offset="22%" stop-color="#f3cf63" />
      <stop offset="50%" stop-color="#b9861d" />
      <stop offset="78%" stop-color="#f8dc7e" />
      <stop offset="100%" stop-color="#8d6212" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7d1" />
      <stop offset="45%" stop-color="#f3cf63" />
      <stop offset="100%" stop-color="#c38e20" />
    </linearGradient>

    <linearGradient id="goldInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7da7c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c9952a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fff0b8" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3D Zar Yüzeyleri -->
    <linearGradient id="dieTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#efe3c8" />
    </linearGradient>
    <linearGradient id="dieLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eadcc0" />
      <stop offset="100%" stop-color="#cfb990" />
    </linearGradient>
    <linearGradient id="dieRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b48d" />
      <stop offset="100%" stop-color="#a58d64" />
    </linearGradient>

    <!-- 3D Okey Taşı Yüzeyleri -->
    <linearGradient id="tileDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cdb892" />
      <stop offset="100%" stop-color="#927b55" />
    </linearGradient>
    <linearGradient id="tileFace" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#fffbf2" />
      <stop offset="58%" stop-color="#f5ead4" />
      <stop offset="100%" stop-color="#e8d8b7" />
    </linearGradient>

    <!-- Kırmızı 13 & Zar Noktası Gradyanı -->
    <linearGradient id="crimsonInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ee3446" />
      <stop offset="100%" stop-color="#a81223" />
    </linearGradient>

    <!-- Koyu Lacivert Zar Noktaları -->
    <radialGradient id="navyPip" cx="38%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#1e3a6e" />
      <stop offset="100%" stop-color="#071024" />
    </radialGradient>

    <!-- İnce Baklava Masa Deseni -->
    <pattern id="feltGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M16 0 L32 16 L16 32 L0 16 Z" fill="none" stroke="#f3d06b" stroke-width="0.7" stroke-opacity="0.07" />
    </pattern>

    <!-- Gölgeler -->
    <filter id="pieceShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#02050d" flood-opacity="0.72" />
    </filter>
    <filter id="goldGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f3d06b" flood-opacity="0.34" />
    </filter>
    <filter id="textShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#02050d" flood-opacity="0.85" />
    </filter>

    <clipPath id="innerFrameClip">
      <rect x="60" y="60" width="392" height="392" rx="70" />
    </clipPath>
  </defs>

  <!-- Tam Kanamalı Koyu Lacivert Arka Plan -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgNavy)" />

  <!-- Çerçeve İçi Masa Dokusu ve Işık -->
  <g clip-path="url(#innerFrameClip)">
    <rect x="60" y="60" width="392" height="392" fill="url(#feltGrid)" />
    <circle cx="256" cy="224" r="190" fill="url(#centerGlow)" />
  </g>

  <!-- Çift Katmanlı Altın Çerçeve -->
  <rect
    x="40"
    y="40"
    width="432"
    height="432"
    rx="88"
    fill="none"
    stroke="url(#goldFrame)"
    stroke-width="11"
    filter="url(#goldGlow)"
  />
  <rect
    x="60"
    y="60"
    width="392"
    height="392"
    rx="70"
    fill="none"
    stroke="url(#goldInner)"
    stroke-width="2.2"
  />

  <!-- Köşe Altın Elmas Süslemeleri -->
  <g fill="url(#goldFrame)" opacity="0.88">
    <polygon points="94,86 101,94 94,102 87,94" />
    <polygon points="418,86 425,94 418,102 411,94" />
    <polygon points="94,410 101,418 94,426 87,418" />
    <polygon points="418,410 425,418 418,426 411,418" />
  </g>

  <!-- Zemin Temas Gölgesi -->
  <ellipse cx="252" cy="334" rx="134" ry="20" fill="#02050d" opacity="0.68" />

  <!-- 3D İZOMETRİK ZAR (Sol-Arka) -->
  <g transform="translate(182, 212) scale(0.9) translate(-182, -238)" filter="url(#pieceShadow)">
    <!-- Üst Yüzey -->
    <polygon
      points="182,148 260,193 182,238 104,193"
      fill="url(#dieTop)"
      stroke="#fffdf7"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Sol Yüzey -->
    <polygon
      points="104,193 182,238 182,328 104,283"
      fill="url(#dieLeft)"
      stroke="#dfd0b2"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Sağ Yüzey -->
    <polygon
      points="182,238 260,193 260,283 182,328"
      fill="url(#dieRight)"
      stroke="#b69f78"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
    <!-- Kenar Parlama Çizgileri -->
    <polyline
      points="106,194 182,238 258,194"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.65"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line x1="182" y1="238" x2="182" y2="326" stroke="#fff7e2" stroke-opacity="0.38" stroke-width="2" />

    <!-- Üst Yüzey Kırmızı 3 Nokta -->
    <g fill="url(#crimsonInk)">
      <ellipse cx="148" cy="193" rx="11.5" ry="6.8" />
      <ellipse cx="182" cy="193" rx="11.5" ry="6.8" />
      <ellipse cx="216" cy="193" rx="11.5" ry="6.8" />
    </g>

    <!-- Sol Yüzey Koyu Lacivert 5 Nokta -->
    <g fill="url(#navyPip)">
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(124,228) skewY(30)" />
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(162,250) skewY(30)" />
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(143,261) skewY(30)" />
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(124,272) skewY(30)" />
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(162,294) skewY(30)" />
    </g>

    <!-- Sağ Yüzey 2 Nokta -->
    <g fill="url(#navyPip)">
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(205,286) skewY(-30)" />
      <ellipse cx="0" cy="0" rx="8.2" ry="9.2" transform="translate(237,236) skewY(-30)" />
    </g>
  </g>

  <!-- 13 NUMARALI KIRMIZI 3D OKEY TAŞI (Sağ-Ön) -->
  <g transform="translate(314, 224) rotate(10) scale(0.9)" filter="url(#pieceShadow)">
    <!-- 3D Kalınlık Gövdesi -->
    <rect x="-56" y="-82" width="140" height="194" rx="22" fill="url(#tileDepth)" />
    <rect x="-63" y="-89" width="140" height="194" rx="22" fill="#d8c5a0" />
    <!-- Ana Saten Fildişi Ön Yüz -->
    <rect
      x="-70"
      y="-97"
      width="140"
      height="194"
      rx="21"
      fill="url(#tileFace)"
      stroke="#e3d2b0"
      stroke-width="2"
    />
    <!-- İç İnce Parlama Çerçevesi -->
    <rect
      x="-61"
      y="-88"
      width="122"
      height="176"
      rx="14"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.72"
      stroke-width="1.6"
    />

    <!-- Saf Vektör Kırmızı "13" Rakamı -->
    <g fill="url(#crimsonInk)">
      <path d="M-43,-47 L-25,-63 L-13,-63 L-13,8 L-28,8 L-28,-44 L-40,-34 Z" />
      <rect x="-41" y="1" width="39" height="11" rx="3.5" />
      <path
        d="M5,-52 C11,-61 21,-65 34,-64 C48,-63 56,-54 56,-42 C56,-33 51,-26 42,-23 C52,-20 58,-12 58,-1 C58,14 47,23 30,23 C17,23 7,18 2,9 L14,1 C17,7 22,10 30,10 C38,10 43,5 43,-2 C43,-10 38,-14 27,-14 L19,-14 L19,-27 L27,-27 C36,-27 41,-32 41,-39 C41,-46 37,-51 29,-51 C22,-51 18,-48 15,-43 Z"
        transform="translate(-4, -10) scale(0.92)"
      />
    </g>

    <!-- Altın Çerçeveli Kırmızı Okey Yıldız Amblemi -->
    <circle cx="0" cy="52" r="24" fill="url(#crimsonInk)" stroke="url(#goldFrame)" stroke-width="3.2" />
    <polygon
      points="0,36 4.6,46.2 15.6,47.3 7.2,54.6 9.6,65.5 0,59.7 -9.6,65.5 -7.2,54.6 -15.6,47.3 -4.6,46.2"
      fill="url(#goldFrame)"
    />
  </g>

  <!-- Alt Ayırıcı Altın Çizgi -->
  <line x1="118" y1="354" x2="394" y2="354" stroke="url(#goldFrame)" stroke-width="2" stroke-opacity="0.55" />

  <!-- MASA 3D Alt Başlık Yazısı -->
  <text
    x="256"
    y="412"
    text-anchor="middle"
    fill="url(#goldText)"
    stroke="#5c3d08"
    stroke-width="1.2"
    paint-order="stroke"
    font-family="'Outfit', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="5"
    filter="url(#textShadow)"
  >MASA 3D</text>
</svg>
