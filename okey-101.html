<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>3D Okey 101 — Masa Oyunları 3D</title>
    <meta
      name="description"
      content="Three.js ile prosedürel 3D ahşap ıstaka, 106 taş ve 3 akıllı AI bot ile gerçekçi 3D Okey 101 masa oyunu."
    />
    <style>
      :root {
        --bg-void: #050b16;
        --panel-bg: rgba(8, 16, 34, 0.88);
        --panel-soft: rgba(13, 25, 50, 0.82);
        --border-gold: rgba(212, 175, 55, 0.34);
        --border-subtle: rgba(148, 163, 184, 0.2);
        --gold: #f3d06b;
        --gold-deep: #c79a26;
        --cyan: #22d3ee;
        --emerald: #34d399;
        --danger: #f87171;
        --text-main: #f8fafc;
        --text-dim: #cbd5e1;
        --text-muted: #8ca0bf;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-void);
        color: var(--text-main);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      /* Fullscreen 3D WebGL Canvas */
      #canvas-wrap {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: radial-gradient(ellipse 80% 70% at 50% 45%, #112a3d 0%, #071324 58%, #040914 100%);
        touch-action: none;
      }

      #canvas-wrap canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ================= TOP HUD BAR ================= */
      .hud-top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        padding: 10px 18px;
        background: linear-gradient(180deg, rgba(5, 11, 24, 0.94) 0%, rgba(7, 15, 32, 0.8) 100%);
        border-bottom: 1px solid var(--border-gold);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .hud-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }

      .game-title-wrap {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .game-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: var(--gold);
        white-space: nowrap;
      }

      .game-stake-sub {
        font-size: 0.72rem;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      /* Mini Gösterge & Okey Indicator */
      .okey-indicator-group {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        border-radius: 10px;
        background: rgba(14, 28, 56, 0.85);
        border: 1px solid rgba(243, 208, 107, 0.28);
      }

      .mini-tile-slot {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .mini-tile-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        font-weight: 600;
      }

      .mini-tile {
        min-width: 28px;
        height: 34px;
        padding: 0 5px;
        border-radius: 5px;
        background: linear-gradient(180deg, #fffdf7 0%, #eae0c9 100%);
        border: 1px solid rgba(180, 145, 70, 0.65);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 0.92rem;
        line-height: 1;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }

      .mini-tile .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        margin-top: 2px;
      }

      .mini-tile.is-okey {
        box-shadow: 0 0 0 2px rgba(243, 208, 107, 0.85), 0 0 12px rgba(243, 208, 107, 0.4);
      }

      /* 4-Player Status Strip */
      .players-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow-x: auto;
      }

      .player-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 11px;
        border-radius: 9px;
        background: rgba(14, 26, 52, 0.76);
        border: 1px solid var(--border-subtle);
        white-space: nowrap;
        flex-shrink: 0;
        transition: border-color 180ms var(--ease), background-color 180ms var(--ease);
      }

      .player-box.active-turn {
        border-color: var(--gold);
        background: rgba(34, 48, 84, 0.92);
        box-shadow: 0 0 14px rgba(243, 208, 107, 0.22);
      }

      .player-name {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-main);
      }

      .player-meta {
        font-size: 0.72rem;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      .player-status {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 5px;
      }

      .player-status.opened {
        color: #6ee7b7;
        background: rgba(16, 185, 129, 0.16);
      }

      .player-status.closed {
        color: #94a3b8;
        background: rgba(148, 163, 184, 0.12);
      }

      /* Right HUD Zone */
      .hud-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .chip-box {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 36px;
        padding: 0 12px;
        border-radius: 9px;
        background: rgba(20, 32, 62, 0.86);
        border: 1px solid var(--border-gold);
        white-space: nowrap;
      }

      .chip-val {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--gold);
      }

      .chip-unit {
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      .hud-btn {
        appearance: none;
        height: 36px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--border-subtle);
        background: rgba(14, 26, 52, 0.82);
        color: var(--text-dim);
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 120ms var(--ease);
      }

      .hud-btn:hover {
        background: rgba(24, 42, 82, 0.92);
        border-color: rgba(243, 208, 107, 0.45);
        color: var(--text-main);
      }

      .hud-btn:active {
        transform: scale(0.96);
      }

      .hud-btn.lobby-link {
        border-color: rgba(243, 208, 107, 0.48);
        color: var(--gold);
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.16), rgba(14, 26, 52, 0.9));
      }

      .hud-btn.lobby-link:hover {
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.28), rgba(20, 36, 70, 0.95));
      }

      /* ================= TURN BANNER & TOAST ================= */
      .turn-banner {
        position: fixed;
        top: 66px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 18;
        padding: 6px 16px;
        border-radius: 9px;
        background: rgba(7, 15, 32, 0.84);
        border: 1px solid rgba(243, 208, 107, 0.32);
        color: var(--text-main);
        font-size: 0.82rem;
        font-weight: 600;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }

      .turn-banner.highlight {
        border-color: var(--gold);
        color: var(--gold);
      }

      .toast {
        position: fixed;
        top: 106px;
        left: 50%;
        transform: translateX(-50%) translateY(-10px);
        z-index: 35;
        padding: 9px 18px;
        border-radius: 9px;
        background: rgba(8, 16, 36, 0.95);
        border: 1px solid var(--border-gold);
        color: var(--text-main);
        font-size: 0.83rem;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
        transition: opacity 180ms var(--ease), transform 180ms var(--ease);
      }

      .toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .toast.error {
        border-color: rgba(248, 113, 113, 0.7);
        color: #fecaca;
      }

      .toast.success {
        border-color: rgba(52, 211, 153, 0.7);
        color: #a7f3d0;
      }

      /* ================= BOTTOM ACTION DOCK ================= */
      .action-dock {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        max-width: min(1220px, 96vw);
        padding: 8px 12px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(10, 20, 44, 0.92) 0%, rgba(6, 12, 28, 0.95) 100%);
        border: 1px solid var(--border-gold);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      .dock-divider {
        width: 1px;
        height: 26px;
        background: rgba(148, 163, 184, 0.22);
        flex-shrink: 0;
        margin: 0 2px;
      }

      .act-btn {
        appearance: none;
        height: 40px;
        padding: 0 14px;
        border-radius: 9px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(18, 34, 68, 0.85);
        color: var(--text-main);
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 120ms var(--ease), opacity 150ms var(--ease);
      }

      .act-btn:hover:not(:disabled) {
        background: rgba(28, 50, 98, 0.95);
        border-color: rgba(243, 208, 107, 0.55);
      }

      .act-btn:active:not(:disabled) {
        transform: scale(0.96);
      }

      .act-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      .act-btn.primary {
        background: linear-gradient(135deg, #e5bf4b 0%, #c19220 100%);
        border-color: rgba(254, 240, 138, 0.6);
        color: #070d1c;
      }

      .act-btn.primary:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      .act-btn.emerald {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.28), rgba(6, 78, 59, 0.72));
        border-color: rgba(52, 211, 153, 0.62);
        color: #a7f3d0;
      }

      .act-btn.cyan {
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(14, 54, 82, 0.78));
        border-color: rgba(34, 211, 238, 0.55);
        color: #a5f3fc;
      }

      .act-btn.danger {
        background: linear-gradient(135deg, rgba(244, 63, 94, 0.24), rgba(88, 16, 36, 0.78));
        border-color: rgba(251, 113, 133, 0.58);
        color: #fecdd3;
      }

      .act-btn.active-mode {
        border-color: var(--cyan);
        background: rgba(14, 66, 94, 0.9);
        color: #67e8f9;
      }

      .score-inline {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
        font-size: 0.76rem;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.28);
      }

      /* ================= ROUND END MODAL ================= */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(3, 7, 18, 0.78);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal-card {
        width: 100%;
        max-width: 520px;
        padding: 26px;
        border-radius: 16px;
        background: linear-gradient(160deg, rgba(16, 30, 64, 0.96) 0%, rgba(7, 14, 32, 0.98) 100%);
        border: 1px solid var(--border-gold);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      }

      .modal-kicker {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--gold);
        margin-bottom: 4px;
      }

      .modal-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.65rem;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 6px;
      }

      .modal-sub {
        font-size: 0.88rem;
        color: var(--text-dim);
        margin-bottom: 18px;
      }

      .score-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 18px;
      }

      .score-table th,
      .score-table td {
        padding: 9px 10px;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        font-size: 0.84rem;
      }

      .score-table th {
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.75rem;
      }

      .score-table td.num,
      .score-table th.num {
        text-align: right;
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      .score-table tr.winner-row td {
        color: var(--gold);
        font-weight: 700;
      }

      .reward-summary {
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(6, 13, 30, 0.78);
        border: 1px solid rgba(243, 208, 107, 0.28);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        font-size: 0.88rem;
      }

      .reward-amount {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 1rem;
      }

      .reward-amount.pos {
        color: var(--emerald);
      }

      .reward-amount.neg {
        color: var(--danger);
      }

      .modal-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }

      @media (max-width: 1120px) {
        .hud-top {
          flex-wrap: wrap;
          padding: 8px 12px;
          gap: 8px;
        }
        .players-strip {
          order: 3;
          width: 100%;
          justify-content: space-between;
        }
        .turn-banner {
          top: 104px;
        }
        .toast {
          top: 142px;
        }
      }

      @media (max-width: 640px) {
        .hud-btn span {
          display: none;
        }
        .hud-btn.lobby-link span {
          display: inline;
        }
        .action-dock {
          padding: 6px 8px;
          gap: 6px;
        }
        .act-btn {
          height: 36px;
          padding: 0 10px;
          font-size: 0.74rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- 3D Three.js Canvas Container -->
    <div id="canvas-wrap" aria-label="3D Okey 101 Oyun Masası"></div>

    <!-- TOP HUD -->
    <header class="hud-top">
      <div class="hud-left">
        <div class="game-title-wrap">
          <div class="game-title">3D OKEY 101</div>
          <div class="game-stake-sub" id="stake-sub">Masa: 500 Çip</div>
        </div>

        <div class="okey-indicator-group" aria-label="Gösterge ve Okey Taşı">
          <div class="mini-tile-slot">
            <span class="mini-tile-label">Gösterge</span>
            <div class="mini-tile" id="hud-indicator">-</div>
          </div>
          <div class="mini-tile-slot">
            <span class="mini-tile-label">Okey</span>
            <div class="mini-tile is-okey" id="hud-okey">-</div>
          </div>
        </div>
      </div>

      <!-- 4 Players Status -->
      <div class="players-strip" id="players-strip" aria-label="Oyuncu Durumları"></div>

      <!-- Right: Chips, Audio, Camera, Lobby Return -->
      <div class="hud-right">
        <div class="chip-box" title="Ortak Platform Çip Bakiyesi">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="rgba(243,208,107,0.18)" stroke="#F3D06B" stroke-width="1.8" />
            <circle cx="12" cy="12" r="4.8" stroke="#D4AF37" stroke-width="1.4" stroke-dasharray="2.5 2" />
          </svg>
          <span class="chip-val" id="hud-chips">10.000</span>
          <span class="chip-unit">Çip</span>
        </div>

        <button type="button" class="hud-btn" id="btn-cam" title="Kamera modunu değiştir (V)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
          <span id="cam-label">Dinamik Kamera</span>
        </button>

        <button type="button" class="hud-btn" id="btn-sound" title="Ses efektlerini aç/kapat">
          <svg id="ico-sound-on" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <svg id="ico-sound-off" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
          <span id="sound-label">Ses</span>
        </button>

        <a href="index.html" class="hud-btn lobby-link" id="btn-lobby">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
            <path d="M3 12h18" />
            <path d="M9 6l-6 6 6 6" />
          </svg>
          <span>Ana Lobiye Dön</span>
        </a>
      </div>
    </header>

    <!-- Turn Banner & Toast -->
    <div class="turn-banner" id="turn-banner">Oyun hazırlanıyor...</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- BOTTOM ACTION DOCK -->
    <nav class="action-dock" aria-label="Okey 101 Aksiyonları">
      <button type="button" class="act-btn cyan" id="btn-draw-center">Ortadan Çek</button>
      <button type="button" class="act-btn" id="btn-draw-side">Yandan Al</button>
      <button type="button" class="act-btn danger" id="btn-return-side" style="display:none">Yandan İade Et</button>

      <div class="dock-divider" aria-hidden="true"></div>

      <button type="button" class="act-btn emerald" id="btn-open-melds">
        <span id="open-btn-text">Perleri Aç</span>
        <span class="score-inline" id="live-meld-score">0 / 101</span>
      </button>

      <button type="button" class="act-btn" id="btn-layoff">İşlek Ekle</button>
      <button type="button" class="act-btn primary" id="btn-discard">Seçili Taşı At</button>

      <div class="dock-divider" aria-hidden="true"></div>

      <button type="button" class="act-btn" id="btn-multiselect" title="Birden fazla taş seçmek için aç/kapat (veya Shift+Tıkla)">
        Per Seç
      </button>
      <button type="button" class="act-btn" id="btn-sort-series">Seri Diz</button>
      <button type="button" class="act-btn" id="btn-sort-pairs">Çift Diz</button>
    </nav>

    <!-- END-OF-ROUND SCOREBOARD MODAL -->
    <div class="modal-backdrop" id="round-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-kicker" id="modal-kicker">EL SONU</div>
        <h2 class="modal-title" id="modal-title">Tebrikler!</h2>
        <p class="modal-sub" id="modal-sub">El puanları hesaplandı.</p>
        <table class="score-table">
          <thead>
            <tr>
              <th>Oyuncu</th>
              <th>Durum</th>
              <th class="num">Kalan Taş</th>
              <th class="num">Ceza Puanı</th>
            </tr>
          </thead>
          <tbody id="modal-tbody"></tbody>
        </table>
        <div class="reward-summary">
          <span>Masa Çip Sonucu</span>
          <span class="reward-amount" id="modal-reward">+0 Çip</span>
        </div>
        <div class="modal-actions">
          <a href="index.html" class="hud-btn lobby-link">Ana Lobiye Dön</a>
          <button type="button" class="act-btn primary" id="btn-next-round">Yeni El Başlat</button>
        </div>
      </div>
    </div>

    <script src="./three.min.js"></script>
    <script>
      (() => {
        'use strict';

        function createStudioEnvScene() {
          const env = new THREE.Scene();
          env.add(
            new THREE.Mesh(
              new THREE.BoxGeometry(28, 18, 28),
              new THREE.MeshStandardMaterial({
                color: 0x182132,
                roughness: 0.9,
                metalness: 0.05,
                side: THREE.BackSide,
              })
            )
          );
          env.add(new THREE.AmbientLight(0xffffff, 0.72));
          const addPanel = (hex, intensity, pos, rot, w, h) => {
            const p = new THREE.Mesh(

      function getEffectiveTile(tile) {

      function createDeck106() {
        const deck = [];
        let uid = 1;
        for (let copy = 0; copy < 2; copy++) {

      /**
       * Validates whether an array of tiles forms a legal Okey 101 Run (Seri) or Set (Per).
       * Returns null if invalid, or detailed meld object with optimal score and sorted tile order.
       */
      function evaluateMeld(tiles) {
        if (!tiles || tiles.length < 3 || tiles.length > 13) return null;

        const wildcards = [];
        const regulars = [];
        for (const t of tiles) {
          const eff = getEffectiveTile(t);
          if (eff.wildcard) wildcards.push(t);
          else regulars.push({ tile: t, color: eff.color, num: eff.num });
        }

        if (regulars.length === 0) return null;

        let bestResult = null;

        // 1. Check SET (Per: 3 or 4 tiles, same number, distinct colors)
        if (tiles.length === 3 || tiles.length === 4) {
          const targetNum = regulars[0].num;
          const usedColors = new Set();
          let validSet = true;
          for (const r of regulars) {
            if (r.num !== targetNum || usedColors.has(r.color)) {
              validSet = false;
              break;
            }
            usedColors.add(r.color);
          }
          if (validSet) {
            const missingColors = COLORS.filter((c) => !usedColors.has(c));
            const ordered = [
              ...regulars
                .slice()
                .sort((a, b) => COLORS.indexOf(a.color) - COLORS.indexOf(b.color))
                .map((r) => ({ tile: r.tile, assignedColor: r.color, assignedNum: targetNum })),
              ...wildcards.map((w, idx) => ({
                tile: w,
                assignedColor: missingColors[idx] || COLORS[0],
                assignedNum: targetNum,
              })),
            ];
            bestResult = {
              type: 'set',
              setNum: targetNum,
              usedColors: Array.from(usedColors),
              tiles: ordered.map((o) => o.tile),
              slots: ordered,
              points: targetNum * tiles.length,
            };
          }
        }

        // 2. Check RUN (Seri: same color, consecutive numbers 1..13, plus 12-13-1 wrap)
        const runColor = regulars[0].color;
        if (regulars.every((r) => r.color === runColor)) {
          // Ensure distinct numbers
          const numMap = new Map();
          let uniqueNums = true;
          for (const r of regulars) {
            if (numMap.has(r.num)) {
              uniqueNums = false;
              break;
            }
            numMap.set(r.num, r.tile);
          }

          if (uniqueNums) {
            const len = tiles.length;
            // Try every possible starting number start in [1 .. 14 - len] (standard 1..13)
            // plus wrap-ending at 14 (meaning 12-13-1 where 14 represents ace-high 1 valued as 1)
            const maxStart = len <= 13 ? 15 - len : 1;
            for (let start = 1; start <= maxStart; start++) {
              const end = start + len - 1;
              if (end > 14) continue;
              // If end === 14, number 1 plays as position 14, so start must be >= 2
              if (end === 14 && start === 1) continue;

              // Check all regulars fit inside [start .. end]
              let fits = true;
              const slotMap = new Map();
              for (const r of regulars) {
                const pos = end === 14 && r.num === 1 ? 14 : r.num;
                if (pos < start || pos > end || slotMap.has(pos)) {
                  fits = false;
                  break;
                }
                slotMap.set(pos, r.tile);
              }
              if (!fits) continue;

              const gaps = len - regulars.length;
              if (gaps !== wildcards.length) continue;

              // Build ordered slots and calculate exact points
              const orderedSlots = [];
              let wIdx = 0;
              let pts = 0;
              for (let pos = start; pos <= end; pos++) {
                const faceNum = pos === 14 ? 1 : pos;
                pts += faceNum;
                if (slotMap.has(pos)) {
                  orderedSlots.push({ tile: slotMap.get(pos), assignedColor: runColor, assignedNum: faceNum, pos });
                } else {
                  orderedSlots.push({ tile: wildcards[wIdx++], assignedColor: runColor, assignedNum: faceNum, pos });
                }
              }

              if (!bestResult || pts > bestResult.points) {
                bestResult = {
                  type: 'run',
                  color: runColor,
                  startPos: start,
                  endPos: end,
                  tiles: orderedSlots.map((s) => s.tile),
                  slots: orderedSlots,
                  points: pts,
                };
              }
            }
          }
        }

        return bestResult;
      }

      /**
       * Analyzes contiguous groups separated by empty slots on the player's 28-slot rack.
       */
      function getHumanRackGroups() {
        const rack = game.players[0].rack;
        const validMelds = [];
        let totalPoints = 0;

        for (let row = 0; row < 2; row++) {
          const rowStart = row * 14;
          let group = [];
          let slotIndices = [];
          for (let col = 0; col <= 14; col++) {
            const tile = col < 14 ? rack[rowStart + col] : null;
            if (tile) {
              group.push(tile);
              slotIndices.push(rowStart + col);
            } else {
              if (group.length >= 3) {
                const ev = evaluateMeld(group);
                if (ev) {
                  validMelds.push({ ...ev, slotIndices: [...slotIndices], row });
                  totalPoints += ev.points;
                }
              }
              group = [];
              slotIndices = [];
            }
          }
        }
        return { validMelds, totalPoints };
      }

      /**
       * Fast combinatorial solver used by AI bots AND "Seri Diz" auto-sort
       * to extract maximum-point disjoint valid melds from a hand.
       */
      function findBestMelds(hand) {
        const okeys = [];
        const regulars = [];
        for (const t of hand) {
          if (isRealOkey(t)) okeys.push(t);
          else regulars.push(t);
        }

        const candidates = [];

        // Generate Set candidates (same effective num, distinct effective colors)
        const byNum = new Map();
        for (const t of regulars) {
          const eff = getEffectiveTile(t);
          if (!byNum.has(eff.num)) byNum.set(eff.num, []);
          byNum.get(eff.num).push({ tile: t, color: eff.color, num: eff.num });
        }

        for (const [num, items] of byNum.entries()) {
          // Unique by color (pick 1st copy per color for clean candidate generation)
          const perColor = new Map();
          for (const it of items) {
            if (!perColor.has(it.color)) perColor.set(it.color, []);
            perColor.get(it.color).push(it.tile);
          }
          const cols = Array.from(perColor.keys());
          // 4-color sets
          if (cols.length === 4) {
            const group = cols.map((c) => perColor.get(c)[0]);
            const ev = evaluateMeld(group);
            if (ev) candidates.push(ev);
          }
          // 3-color sets
          if (cols.length >= 3) {
            for (let i = 0; i < cols.length; i++) {
              for (let j = i + 1; j < cols.length; j++) {
                for (let k = j + 1; k < cols.length; k++) {
                  const group = [perColor.get(cols[i])[0], perColor.get(cols[j])[0], perColor.get(cols[k])[0]];
                  const ev = evaluateMeld(group);
                  if (ev) candidates.push(ev);
                }
              }
            }
          }
          // 2-color + 1 okey sets
          if (cols.length >= 2 && okeys.length >= 1) {
            for (let i = 0; i < cols.length; i++) {
              for (let j = i + 1; j < cols.length; j++) {
                const group = [perColor.get(cols[i])[0], perColor.get(cols[j])[0], okeys[0]];
                const ev = evaluateMeld(group);
                if (ev) candidates.push(ev);
              }
            }
          }
        }

        // Generate Run candidates per color
        for (const color of COLORS) {
          const byPos = new Map();
          for (const t of regulars) {
            const eff = getEffectiveTile(t);
            if (eff.color !== color) continue;
            if (!byPos.has(eff.num)) byPos.set(eff.num, []);
            byPos.get(eff.num).push(t);
          }

          for (let start = 1; start <= 12; start++) {
            for (let len = 3; len <= 7; len++) {
              const end = start + len - 1;
              if (end > 14) break;
              if (end === 14 && start === 1) continue;

              const chosen = [];
              let missing = 0;
              for (let pos = start; pos <= end; pos++) {
                const face = pos === 14 ? 1 : pos;
                const list = byPos.get(face);
                if (list && list.length > 0) {
                  chosen.push(list[0]);
                } else {
                  missing++;
                }
              }

              if (missing <= okeys.length && chosen.length >= 2) {
                const group = [...chosen, ...okeys.slice(0, missing)];
                const ev = evaluateMeld(group);
                if (ev) candidates.push(ev);
              }
            }
          }
        }

        // Deduplicate candidates by sorted tile IDs & sort descending by points
        const seen = new Set();
        const unique = [];
        for (const c of candidates) {
          const key = c.tiles
            .map((t) => t.id)
            .sort((a, b) => a - b)
            .join('-');
          if (!seen.has(key)) {
            seen.add(key);
            unique.push(c);
          }
        }
        unique.sort((a, b) => b.points - a.points);

        // Greedy + limited branch-and-bound search over top candidates for optimal score
        const pool = unique.slice(0, 42);
        let bestMelds = [];
        let bestScore = 0;
        let iterations = 0;

        function search(idx, usedIds, currentMelds, currentScore) {
          iterations++;
          if (iterations > 2500) return;

          if (currentScore > bestScore) {
            bestScore = currentScore;
            bestMelds = currentMelds.slice();
          }

          // Upper bound pruning
          let upper = currentScore;
          for (let i = idx; i < pool.length && upper < bestScore + 120; i++) {
            upper += pool[i].points;
          }
          if (upper <= bestScore) return;

          for (let i = idx; i < pool.length; i++) {
            const cand = pool[i];
            let conflict = false;
            for (const t of cand.tiles) {
              if (usedIds.has(t.id)) {
                conflict = true;
                break;
              }
            }
            if (conflict) continue;

            for (const t of cand.tiles) usedIds.add(t.id);
            currentMelds.push(cand);
            search(i + 1, usedIds, currentMelds, currentScore + cand.points);
            currentMelds.pop();
            for (const t of cand.tiles) usedIds.delete(t.id);
          }
        }

        search(0, new Set(), [], 0);
        return { melds: bestMelds, totalPoints: bestScore };
      }

      /**
       * Checks if a single tile can be laid off ("işlek") onto a given open meld on the table.
       * Also supports swapping out a real Okey from the meld if the tile matches the Okey's exact slot!
       */
      function tryLayoffOnMeld(tile, meld) {
        // 1. Check if tile can replace a real Okey inside the meld
        if (!isRealOkey(tile)) {
          const eff = getEffectiveTile(tile);
          const okeySlotIdx = meld.slots.findIndex(
            (s) => isRealOkey(s.tile) && s.assignedColor === eff.color && s.assignedNum === eff.num
          );
          if (okeySlotIdx !== -1) {
            const retrievedOkey = meld.slots[okeySlotIdx].tile;
            const newTiles = meld.tiles.map((t, idx) => (idx === okeySlotIdx ? tile : t));
            const reEval = evaluateMeld(newTiles);
            if (reEval) {
              return { kind: 'swap-okey', updatedMeld: reEval, retrievedOkey };
            }
          }
        }

        // 2. Standard append/extend
        const candidateTiles = [...meld.tiles, tile];
        const reEval = evaluateMeld(candidateTiles);
        if (reEval) {
          return { kind: 'extend', updatedMeld: reEval, retrievedOkey: null };
        }
        return null;
      }

      /* =========================================================================

      const canvasWrap = document.getElementById('canvas-wrap');

      const isSoftwareGl = (() => {

          const gl = probe.getContext('webgl2') || probe.getContext('webgl');
          if (!gl) return true;
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          const param = ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER;
          const gpu = String(gl.getParameter(param) || '');
          gl.getExtension('WEBGL_lose_context')?.loseContext();
          return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
        } catch {
          return true;

      /* ------------------ PROCEDURAL CANVAS TEXTURES ------------------ */
      function makeColorTex(canvas) {

      // Paired high-resolution lacquered walnut wood Albedo + BumpMap (CanvasTexture)
      function createWalnutWoodPair(baseR = 96, baseG = 52, baseB = 24) {
        const size = 1024;
        const colorCanvas = document.createElement('canvas');
        colorCanvas.width = size;
        colorCanvas.height = size;
        const cCtx = colorCanvas.getContext('2d');

        const bumpCanvas = document.createElement('canvas');
        bumpCanvas.width = size;
        bumpCanvas.height = size;
        const bCtx = bumpCanvas.getContext('2d');

        cCtx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
        cCtx.fillRect(0, 0, size, size);
        bCtx.fillStyle = '#808080';
        bCtx.fillRect(0, 0, size, size);

        // Multi-harmonic walnut cathedral grain bands
        for (let y = 0; y < size; y += 2) {
          const w1 = Math.sin(y * 0.019) * 24;
          const w2 = Math.cos(y * 0.053) * 11;
          const w3 = Math.sin(y * 0.14) * 3.5;
          const ring = Math.sin((y + w1 + w2 + w3) * 0.062);
          const fine = Math.sin(y * 0.34 + w2 * 0.4) * 0.35;
          const delta = Math.floor((ring * 0.78 + fine) * 20);

          const r = Math.max(12, Math.min(245, baseR + delta));
          const g = Math.max(8, Math.min(220, baseG + Math.floor(delta * 0.66)));
          const b = Math.max(4, Math.min(180, baseB + Math.floor(delta * 0.36)));
          cCtx.fillStyle = `rgb(${r},${g},${b})`;
          cCtx.fillRect(0, y, size, 2);

          const bumpVal = Math.max(20, Math.min(235, 128 + Math.floor((ring * 0.65 + fine) * 48)));
          bCtx.fillStyle = `rgb(${bumpVal},${bumpVal},${bumpVal})`;
          bCtx.fillRect(0, y, size, 2);
        }

        // Flowing dark walnut grain veins & matching recessed pores in bumpMap
        for (let i = 0; i < 110; i++) {
          const sy = Math.random() * size;
          const amp = (Math.random() - 0.5) * 44;
          const amp2 = (Math.random() - 0.5) * 44;
          const lw = 0.8 + Math.random() * 2.1;

          cCtx.strokeStyle = `rgba(18, 7, 2, ${0.14 + Math.random() * 0.24})`;
          cCtx.lineWidth = lw;
          cCtx.beginPath();
          cCtx.moveTo(0, sy);
          cCtx.bezierCurveTo(size * 0.33, sy + amp, size * 0.66, sy + amp2, size, sy);
          cCtx.stroke();

          bCtx.strokeStyle = `rgba(28, 28, 28, ${0.28 + Math.random() * 0.32})`;
          bCtx.lineWidth = lw * 1.15;
          bCtx.beginPath();
          bCtx.moveTo(0, sy);
          bCtx.bezierCurveTo(size * 0.33, sy + amp, size * 0.66, sy + amp2, size, sy);
          bCtx.stroke();
        }

        // Subtle warm satin wood knots & micro-pores
        for (let k = 0; k < 4; k++) {
          const kx = 140 + Math.random() * (size - 280);
          const ky = 140 + Math.random() * (size - 280);
          const rx = 28 + Math.random() * 36;
          const ry = 10 + Math.random() * 14;
          cCtx.save();
          cCtx.translate(kx, ky);
          cCtx.scale(1, ry / rx);
          const kg = cCtx.createRadialGradient(0, 0, 2, 0, 0, rx);
          kg.addColorStop(0, 'rgba(22, 9, 3, 0.52)');
          kg.addColorStop(0.6, 'rgba(42, 19, 8, 0.22)');
          kg.addColorStop(1, 'rgba(42, 19, 8, 0)');
          cCtx.fillStyle = kg;
          cCtx.beginPath();
          cCtx.arc(0, 0, rx, 0, Math.PI * 2);
          cCtx.fill();
          cCtx.restore();
        }

        const colorTex = makeColorTex(colorCanvas);
        colorTex.wrapS = THREE.RepeatWrapping;
        colorTex.wrapT = THREE.RepeatWrapping;

        const bumpTex = makeDataTex(bumpCanvas);
        bumpTex.wrapS = THREE.RepeatWrapping;
        bumpTex.wrapT = THREE.RepeatWrapping;

        return { color: colorTex, bump: bumpTex };
      }

      // Ultra-sharp 512x768 high-DPI procedural tile face generator
      function getTileFrontTexture(tile) {
        const okeyFlag = isRealOkey(tile);
        const key = `${tile.isFakeJoker ? 'FJ' : tile.color}-${tile.number}-${okeyFlag ? 'OK' : 'N'}`;

        const tex = makeColorTex(c);

      /* ------------------ ACTIVE-TURN NEON GREEN RACK LIGHT RINGS (ALL 4 PLAYERS) ------------------ */
      function createNeonFrameHaloTex() {
        const w = 512;
        const h = 256;
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        const drawBorderGlow = (blur, lw, alpha) => {
          ctx.save();
          ctx.shadowColor = `rgba(16, 255, 128, ${alpha})`;
          ctx.shadowBlur = blur;
          ctx.strokeStyle = `rgba(34, 255, 136, ${alpha})`;
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.roundRect(42, 34, w - 84, h - 68, 28);
          ctx.stroke();
          ctx.restore();
        };
        drawBorderGlow(36, 18, 0.55);
        drawBorderGlow(18, 10, 0.82);
        drawBorderGlow(6, 5, 1.0);

        return makeColorTex(c);
      }

      const neonFrameHaloTex = createNeonFrameHaloTex();

      function buildRoundedRectTubeGeo(w, h, cornerR, tubeR) {
        const hw = w / 2;
        const hh = h / 2;
        const r = Math.min(cornerR, hw * 0.4, hh * 0.4);
        const pts = [];
        const arcSegs = 6;
        const corners = [
          { cx: hw - r, cy: hh - r, a0: 0, a1: Math.PI / 2 },
          { cx: -hw + r, cy: hh - r, a0: Math.PI / 2, a1: Math.PI },
          { cx: -hw + r, cy: -hh + r, a0: Math.PI, a1: Math.PI * 1.5 },
          { cx: hw - r, cy: -hh + r, a0: Math.PI * 1.5, a1: Math.PI * 2 },
        ];
        corners.forEach((c) => {
          for (let i = 0; i <= arcSegs; i++) {
            const a = c.a0 + ((c.a1 - c.a0) * i) / arcSegs;
            pts.push(new THREE.Vector3(c.cx + Math.cos(a) * r, c.cy + Math.sin(a) * r, 0));
          }
        });
        const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.25);
        return new THREE.TubeGeometry(curve, 96, tubeR, 10, true);
      }

      function createRackTurnNeonRing(parentGroup, width, height, localCenterY, localZ, isHorizontalFootprint, footprintD) {

      // 4 Discard Piles on the 4 corners of the playable felt
