      function spawnImpactRing(worldPos, colorHex = 0xf3d06b, scaleBoost = 1.0) {
        const group = new THREE.Group();
        group.position.set(worldPos.x, Math.max(0.035, worldPos.y - 0.04), worldPos.z);

        // Expanding golden/emerald light halo ring
        const ringMat = new THREE.MeshBasicMaterial({
          map: impactRingTex,
          color: colorHex,
          transparent: true,
          opacity: 0.92,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const ring = new THREE.Mesh(new THREE.PlaneGeometry(0.75 * scaleBoost, 0.75 * scaleBoost), ringMat);
        ring.rotation.x = -Math.PI / 2;
        group.add(ring);

        // Soft tactile dust/spark puff burst around tile landing edges
        const dustCount = 12;
        const positions = new Float32Array(dustCount * 3);
        const vels = [];
        for (let i = 0; i < dustCount; i++) {
          const a = (i / dustCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
          const spd = (0.75 + Math.random() * 0.95) * scaleBoost;
          positions[i * 3] = Math.cos(a) * 0.14;
          positions[i * 3 + 1] = 0.04;
          positions[i * 3 + 2] = Math.sin(a) * 0.14;
          vels.push({ vx: Math.cos(a) * spd, vy: 0.55 + Math.random() * 0.65, vz: Math.sin(a) * spd });
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const dustMat = new THREE.PointsMaterial({
          map: impactRingTex,
          color: colorHex,
          size: 0.24 * scaleBoost,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const dust = new THREE.Points(dustGeo, dustMat);
        group.add(dust);

        flightGroup.add(group);
        impactEffects.push({
          group,
          ring,
          ringMat,
          dust,
          dustGeo,
          dustMat,
          vels,
          elapsed: 0,
          duration: 0.54,
          scaleBoost,
        });
      }

      function spawnFlyingTile({
        tile,
        startPos,
        startQuat,
        endPos,
        endQuat,
        startScale = 1.0,
        endScale = 1.0,
        arcHeight = 2.1,
        duration = 0.5,
        delay = 0,
        spinX = 0,
        spinY = Math.PI,
        spinZ = 0.25,
        hideTargetId = null,
        faceDown = false,
        onComplete = null,
      }) {
        const mesh = faceDown
          ? new THREE.Mesh(sharedTileGeo, tileBackMat)
          : createStandingTileMesh(tile);
        mesh.castShadow = !isSoftwareGl;
        mesh.receiveShadow = !isSoftwareGl;
        mesh.position.copy(startPos);
        mesh.quaternion.copy(startQuat);
        mesh.scale.setScalar(startScale);
        mesh.visible = delay <= 0;
        flightGroup.add(mesh);

        if (hideTargetId !== null) {
          hiddenFlyingTileIds.add(hideTargetId);
          const r = rackTileVisuals.get(hideTargetId);
          if (r) r.mesh.visible = false;
          const d = discardTileVisuals.get(hideTargetId);
          if (d) d.visible = false;
          const m = openMeldTileVisuals.get(hideTargetId);
          if (m) m.visible = false;
        }

        activeFlights.push({
          mesh,
          startPos: startPos.clone(),
          startQuat: startQuat.clone(),
          endPos: endPos.clone(),
          endQuat: endQuat.clone(),
          startScale,
          endScale,
          arcHeight,
          duration,
          delay,
          elapsed: 0,
          spinX,
          spinY,
          spinZ,
          hideTargetId,
          onComplete,
        });
      }

      function getRackSlotWorldTransform(slotIndex) {
        humanRackGroup.updateMatrixWorld(true);
        const pos = getSlotLocalPos(slotIndex).applyMatrix4(humanRackGroup.matrixWorld);
        const quat = new THREE.Quaternion();
        humanRackGroup.getWorldQuaternion(quat);
        return { pos, quat };
      }

      function getDrawStackTopWorld() {
        const topY = drawStackBadge.position.y + 0.08;
        return {
          pos: new THREE.Vector3(drawStackGroup.position.x, topY, drawStackGroup.position.z),
          quat: new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)),
        };
      }

      function getDiscardTopWorld(playerIdx, indexOffset = 0) {
        const pile = game.discards[playerIdx];
        const visibleIdx = Math.min(3, Math.max(0, pile.length - 1 + indexOffset));
        const base = discardCoords[playerIdx];
        const x = base.x + (visibleIdx % 2) * 0.03 - 0.015;
        const y = 0.02 + 0.11 + visibleIdx * 0.14;
        const z = base.z;
        const quat = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
        return { pos: new THREE.Vector3(x, y, z), quat };
      }

      function getBotRackWorld(playerIdx) {
        const tr = botRackTransforms[playerIdx];
        const pos = new THREE.Vector3(tr.pos[0], tr.pos[1] + 0.55, tr.pos[2]);
        const quat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, tr.rotY, 0));
        return { pos, quat };
      }

      function clearGroup(grp) {
        while (grp.children.length > 0) {
          const ch = grp.children[0];
          grp.remove(ch);
        }
      }

      function rebuildRackVisuals(immediate = false) {
        const rack = game.players[0].rack;
        const activeIds = new Set();

        for (let slot = 0; slot < RACK_SLOTS; slot++) {
          const tile = rack[slot];
          if (!tile) continue;
          activeIds.add(tile.id);

          let rec = rackTileVisuals.get(tile.id);
          if (!rec) {
            const mesh = createStandingTileMesh(tile);
            mesh.userData = { kind: 'rack-tile', tileId: tile.id };
            const initPos = getSlotLocalPos(slot);
            mesh.position.copy(initPos);
            mesh.visible = !hiddenFlyingTileIds.has(tile.id);
            humanRackGroup.add(mesh);
            rec = {
              mesh,
              tile,
              slot,
              targetPos: initPos.clone(),
            };
            rackTileVisuals.set(tile.id, rec);
          } else {
            rec.slot = slot;
            rec.targetPos.copy(getSlotLocalPos(slot));
            rec.mesh.visible = !hiddenFlyingTileIds.has(tile.id);
            if (immediate) rec.mesh.position.copy(rec.targetPos);
          }
        }

        // Remove meshes no longer on human rack
        for (const [id, rec] of rackTileVisuals.entries()) {
          if (!activeIds.has(id)) {
            humanRackGroup.remove(rec.mesh);
            rackTileVisuals.delete(id);
          }
        }
      }

      function rebuildBotRacks() {
        const miniGeo = new THREE.BoxGeometry(0.32, 0.56, 0.14);
        for (let p = 1; p <= 3; p++) {
          const holder = botRackGroups[p].userData.tilesHolder;
          clearGroup(holder);
          const count = game.players[p].hand.length;
          const maxW = botRackGroups[p].userData.rackWidth - 0.5;
          const visibleCount = Math.min(count, 22);
          const step = visibleCount > 1 ? Math.min(0.35, maxW / (visibleCount - 1)) : 0;
          const startX = -((visibleCount - 1) * step) / 2;

          for (let i = 0; i < visibleCount; i++) {
            const m = new THREE.Mesh(miniGeo, tileBackMat);
            m.position.set(startX + i * step, 0.44, 0.04);
            m.castShadow = !isSoftwareGl;
            holder.add(m);
          }
        }
      }

      function rebuildDrawStackAndIndicator() {
        const count = game.drawPile.length;
        drawStackGroup.visible = count > 0;
        if (count > 0) {
          const h = Math.max(0.18, Math.min(1.1, 0.14 + count * 0.036));
          drawStackBody.scale.y = h / 0.8;
          drawStackBody.position.y = h / 2;
          drawStackBadge.position.y = h + 0.012;
          if (drawStackBadge.material.map) drawStackBadge.material.map.dispose();
          drawStackBadge.material.map = createDrawStackBadgeTex(count);
          drawStackBadge.material.needsUpdate = true;
        }

        // Indicator tile
        while (indicatorHolder.children.length > 1) {
          indicatorHolder.remove(indicatorHolder.children[1]);
        }
        if (game.indicatorTile) {
          const indMesh = createFlatTileMesh(game.indicatorTile, 1.15);
          indMesh.position.y = 0.18;
          indicatorHolder.add(indMesh);
        }
      }

      function rebuildDiscardPiles() {
        discardTileVisuals.clear();
        for (let p = 0; p < 4; p++) {
          const holder = discardHolders[p].tilesGroup;
          clearGroup(holder);
          const pile = game.discards[p];
          const show = pile.slice(-4);
          show.forEach((tile, idx) => {
            const mesh = createFlatTileMesh(tile, 1.16);
            mesh.position.set((idx % 2) * 0.03 - 0.015, 0.11 + idx * 0.14, 0);
            mesh.rotation.y = (idx - show.length + 1) * 0.05;
            mesh.visible = !hiddenFlyingTileIds.has(tile.id);
            if (p === 3) {
              mesh.userData = { kind: 'draw-side' };
            } else if (p === 0) {
              mesh.userData = { kind: 'discard-zone' };
            }
            holder.add(mesh);
            discardTileVisuals.set(tile.id, mesh);
          });
        }
      }

      function rebuildOpenMelds3D() {
        clearGroup(openMeldsGroup);
        openMeldHitMeshes = [];
        openMeldTileVisuals.clear();

        // Layout open melds cleanly in rows across the center felt (z from -0.85 to +2.45)
        const maxRowWidth = 10.2;
        const tileStep = 0.56;
        const meldGap = 0.42;
        const rowPitchZ = 0.96;

        let cursorX = -maxRowWidth / 2;
        let cursorZ = -0.78;

        for (const meld of game.openMelds) {
          const meldW = meld.tiles.length * tileStep;
          if (cursorX + meldW > maxRowWidth / 2 && cursorX > -maxRowWidth / 2) {
            cursorX = -maxRowWidth / 2;
            cursorZ += rowPitchZ;
          }

          const meldGroup = new THREE.Group();
          meldGroup.position.set(cursorX + meldW / 2, 0.09, cursorZ);

          // Subtle tray highlight plate under meld (clickable for İşlek Ekle!)
          const plate = new THREE.Mesh(
            new THREE.PlaneGeometry(meldW + 0.16, 0.84),
            new THREE.MeshBasicMaterial({
              color: 0x22d3ee,
              transparent: true,
              opacity: 0.1,
              depthWrite: false,
            })
          );
          plate.rotation.x = -Math.PI / 2;
          plate.position.y = -0.065;
          plate.userData = { kind: 'open-meld', meldId: meld.id };
          meldGroup.add(plate);
          openMeldHitMeshes.push(plate);

          meld.tiles.forEach((tile, i) => {
            const tm = createFlatTileMesh(tile, 0.98);
            tm.position.set((i - (meld.tiles.length - 1) / 2) * tileStep, 0, 0);
            tm.visible = !hiddenFlyingTileIds.has(tile.id);
            tm.userData = { kind: 'open-meld', meldId: meld.id };
            meldGroup.add(tm);
            openMeldHitMeshes.push(tm);
            openMeldTileVisuals.set(tile.id, tm);
          });

          openMeldsGroup.add(meldGroup);
          cursorX += meldW + meldGap;
        }
        openMeldsGroup.updateMatrixWorld(true);
      }

      /* ------------------ RAYCASTING, DRAG-AND-DROP & CLICK SWAP ------------------ */
      const raycaster = new THREE.Raycaster();
      const pointerNdc = new THREE.Vector2();
      const rackDragPlane = new THREE.Plane();
      const _planeNormal = new THREE.Vector3();
      const _planePoint = new THREE.Vector3();
      const _dragWorldPos = new THREE.Vector3();
      const _dragLocalPos = new THREE.Vector3();

      let hoveredTileId = null;
      let dragState = null; // { tileId, startSlot, startX, startY, active, targetSlot, overDiscard }

      function updatePointerNdc(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function updateRackDragPlane() {
        humanRackGroup.updateMatrixWorld(true);
        _planeNormal.set(0, 0, 1).transformDirection(humanRackGroup.matrixWorld).normalize();
        _planePoint.set(0, 1.0, 0.2).applyMatrix4(humanRackGroup.matrixWorld);
        rackDragPlane.setFromNormalAndCoplanarPoint(_planeNormal, _planePoint);
      }

      function findNearestRackSlot(localPos) {
        let bestSlot = 0;
        let bestDist = Infinity;
        for (let i = 0; i < RACK_SLOTS; i++) {
          const sp = getSlotLocalPos(i);
          const dx = localPos.x - sp.x;
          const dy = localPos.y - sp.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestDist) {
            bestDist = d2;
            bestSlot = i;
          }
        }
        return bestSlot;
      }

      function getRackTileMeshes() {
        const list = [];
        for (const rec of rackTileVisuals.values()) list.push(rec.mesh);
        return list;
      }

      renderer.domElement.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || game.phase === 'ended') return;
        updatePointerNdc(e);
        raycaster.setFromCamera(pointerNdc, camera);

        // 1. Check human rack tiles first
        const tileHits = raycaster.intersectObjects(getRackTileMeshes(), false);
        if (tileHits.length > 0) {
          const tileId = tileHits[0].object.userData.tileId;
          const slot = game.players[0].rack.findIndex((t) => t && t.id === tileId);
          if (slot !== -1) {
            updateRackDragPlane();
            dragState = {
              tileId,
              startSlot: slot,
              startX: e.clientX,
              startY: e.clientY,
              active: false,
              targetSlot: slot,
              overDiscard: false,
              shiftKey: e.shiftKey,
            };
            return;
          }
        }

        // 2. Check clickable empty rack slots (move selected tile to empty slot)
        if (game.selectedTileId !== null && !game.multiSelectMode) {
          const slotHits = raycaster.intersectObjects(slotHitMeshes, false);
          if (slotHits.length > 0) {
            const targetSlot = slotHits[0].object.userData.slotIndex;
            const rack = game.players[0].rack;
            const fromSlot = rack.findIndex((t) => t && t.id === game.selectedTileId);
            if (fromSlot !== -1 && targetSlot !== fromSlot) {
              [rack[fromSlot], rack[targetSlot]] = [rack[targetSlot], rack[fromSlot]];
              game.selectedTileId = null;
              sound.playTileClack(1.0);
              rebuildRackVisuals();
              updateHUD();
              return;
            }
          }
        }

        // 3. Check 3D Center Draw Stack
        const drawHits = raycaster.intersectObjects([drawStackBody, drawStackBadge], false);
        if (drawHits.length > 0) {
          humanDrawFromCenter();
          return;
        }

        // 4. Check 3D Side Discard ("Yandan Al")
        const sideObjects = [discardHolders[3].pad, ...discardHolders[3].tilesGroup.children];
        if (raycaster.intersectObjects(sideObjects, false).length > 0) {
          humanDrawFromSide();
          return;
        }

        // 5. Check 3D Right Discard Zone ("Taş At")
        const discardObjects = [discardHolders[0].pad, ...discardHolders[0].tilesGroup.children];
        if (raycaster.intersectObjects(discardObjects, false).length > 0) {
          if (game.selectedTileId !== null) {
            humanDiscardTile(game.selectedTileId);
          }
          return;
        }

        // 6. Check 3D Open Melds (Click meld to İşlek Ekle!)
        if (openMeldHitMeshes.length > 0) {
          const meldHits = raycaster.intersectObjects(openMeldHitMeshes, false);
          if (meldHits.length > 0) {
            const meldId = meldHits[0].object.userData.meldId;
            humanLayoffToSpecificMeld(meldId);
            return;
          }
        }

        // Clicked blank felt -> clear selection
        if (game.selectedTileId !== null || game.multiSelectedIds.size > 0) {
          game.selectedTileId = null;
          game.multiSelectedIds.clear();
          updateHUD();
        }
      });

      let lastHoverCheck = 0;
      window.addEventListener('pointermove', (e) => {
        updatePointerNdc(e);

        if (dragState) {
          const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
          if (!dragState.active && dist > 6) {
            dragState.active = true;
            game.selectedTileId = dragState.tileId;
          }
          if (dragState.active) {
            raycaster.setFromCamera(pointerNdc, camera);
            if (raycaster.ray.intersectPlane(rackDragPlane, _dragWorldPos)) {
              _dragLocalPos.copy(_dragWorldPos);
              humanRackGroup.worldToLocal(_dragLocalPos);

              // Check if dragged past right edge of rack toward Discard Zone
              dragState.overDiscard = _dragLocalPos.x > RACK_W / 2 + 0.55 && game.turn === 0 && game.phase === 'play';
              dragState.targetSlot = findNearestRackSlot(_dragLocalPos);

              const rec = rackTileVisuals.get(dragState.tileId);
              if (rec) {
                rec.mesh.position.set(_dragLocalPos.x, _dragLocalPos.y, 0.55);
              }
            }
          }
          return;
        }

        // Throttled hover raycast for smooth cursor & lift
        const now = performance.now();
        if (now - lastHoverCheck < 35) return;
        lastHoverCheck = now;

        raycaster.setFromCamera(pointerNdc, camera);
        const hits = raycaster.intersectObjects(getRackTileMeshes(), false);
        if (hits.length > 0) {
          hoveredTileId = hits[0].object.userData.tileId;
          renderer.domElement.style.cursor = 'grab';
        } else {
          hoveredTileId = null;
          const interactive = [drawStackBody, drawStackBadge, discardHolders[3].pad, discardHolders[0].pad, ...openMeldHitMeshes];
          renderer.domElement.style.cursor = raycaster.intersectObjects(interactive, false).length > 0 ? 'pointer' : 'default';
        }
      });

      window.addEventListener('pointerup', () => {
        if (!dragState) return;
        const ds = dragState;
        dragState = null;

        const rack = game.players[0].rack;

        if (ds.active) {
          if (ds.overDiscard) {
            humanDiscardTile(ds.tileId);
            return;
          }
          if (ds.targetSlot !== ds.startSlot) {
            [rack[ds.startSlot], rack[ds.targetSlot]] = [rack[ds.targetSlot], rack[ds.startSlot]];
            sound.playTileClack(0.98);
          } else {
            sound.playTileClack(1.08);
          }
          game.selectedTileId = null;
          rebuildRackVisuals();
          updateHUD();
          return;
        }

        // Short click interaction: Multi-select OR Click-to-Select / Click-to-Swap
        if (ds.shiftKey || game.multiSelectMode) {
          if (game.multiSelectedIds.has(ds.tileId)) {
            game.multiSelectedIds.delete(ds.tileId);
          } else {
            game.multiSelectedIds.add(ds.tileId);
          }
          game.selectedTileId = ds.tileId;
          sound.playTileClack(1.18);
          updateHUD();
          return;
        }

        if (game.selectedTileId === null) {
          game.selectedTileId = ds.tileId;
          sound.playTileClack(1.14);
        } else if (game.selectedTileId === ds.tileId) {
          game.selectedTileId = null;
          sound.playTileClack(0.92);
        } else {
          // Swap the two sequentially clicked tiles!
          const slotA = rack.findIndex((t) => t && t.id === game.selectedTileId);
          const slotB = rack.findIndex((t) => t && t.id === ds.tileId);
          if (slotA !== -1 && slotB !== -1) {
            [rack[slotA], rack[slotB]] = [rack[slotB], rack[slotA]];
            sound.playTileClack(1.0);
          }
          game.selectedTileId = null;
          rebuildRackVisuals();
        }
        updateHUD();
      });

      /* =========================================================================
       * 5. GAMEPLAY ACTIONS (HUMAN + AI BOTS + ROUND LIFECYCLE)
       * ========================================================================= */
      const toastEl = document.getElementById('toast');
      let toastTimeout = null;
      function showToast(msg, kind = 'default') {
        toastEl.textContent = msg;
        toastEl.className = `toast visible ${kind}`;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toastEl.classList.remove('visible'), 2700);
      }

      function placeHumanTilesOnRack(tiles, preserveSpacing = false) {
        const rack = new Array(RACK_SLOTS).fill(null);
        if (!preserveSpacing) {
          tiles.forEach((t, i) => {
            if (i < RACK_SLOTS) rack[i] = t;
          });
        }
        game.players[0].rack = rack;
      }

      function addTileToHumanRack(tile) {
        const rack = game.players[0].rack;
        // Prefer bottom row empty slot first, then top row
        for (let i = 14; i < RACK_SLOTS; i++) {
          if (!rack[i]) {
            rack[i] = tile;
            return i;
          }
        }
        for (let i = 0; i < 14; i++) {
          if (!rack[i]) {
            rack[i] = tile;
            return i;
          }
        }
        return -1;
      }

      function getHumanHandList() {
        return game.players[0].rack.filter(Boolean);
      }

      function clearAllBotTimers() {
        if (game.botTimer) {
          clearTimeout(game.botTimer);
          game.botTimer = null;
        }
        while (game.botTimers.length > 0) {
          clearTimeout(game.botTimers.pop());
        }
      }

      function startNewRound() {
        clearAllBotTimers();
        clearFlightAnimations();
        centerFocusTimer = 0;
        document.getElementById('round-modal').classList.remove('open');

        // Clear texture cache because Okey changes every round!
        for (const tex of tileFaceTexCache.values()) tex.dispose();
        tileFaceTexCache.clear();

        // Clear existing rack meshes so fresh textures are bound
        for (const rec of rackTileVisuals.values()) {
          humanRackGroup.remove(rec.mesh);
        }
        rackTileVisuals.clear();

        const deck = createDeck106();

        // Pick indicator (must not be a Fake Joker)
        const indIdx = deck.findIndex((t) => !t.isFakeJoker);
        game.indicatorTile = deck.splice(indIdx, 1)[0];
        game.okeyColor = game.indicatorTile.color;
        game.okeyNumber = game.indicatorTile.number === 13 ? 1 : game.indicatorTile.number + 1;

        game.discards = [[], [], [], []];
        game.openMelds = [];
        game.tookSideTile = null;
        game.selectedTileId = null;
        game.multiSelectedIds.clear();
        game.nextMeldId = 1;

        // Deal: dealer gets 22 tiles, other 3 players get 21 tiles
        game.players.forEach((p, idx) => {
          p.hasOpened = false;
          const count = idx === game.dealer ? 22 : 21;
          const dealt = deck.splice(0, count);
          if (idx === 0) {
            placeHumanTilesOnRack(dealt);
          } else {
            p.hand = dealt;
          }
        });

        game.drawPile = deck;
        game.turn = game.dealer;
        game.phase = game.turn === 0 ? 'play' : 'bot';

        // Auto-sort player's starting hand cleanly into series for great opening UX
        sortHumanRackBySeries(true);

        rebuildRackVisuals(true);
        rebuildBotRacks();
        rebuildDrawStackAndIndicator();
        rebuildDiscardPiles();
        rebuildOpenMelds3D();
        updateIndicatorHUD();
        updateHUD();

        showToast(
          `El ${game.round} başladı! Okey: ${COLOR_NAME[game.okeyColor]} ${game.okeyNumber}`,
          'success'
        );

        if (game.turn !== 0) {
          scheduleBotTurn();
        } else {
          sound.playTurnNotify();
        }
      }

      function humanDrawFromCenter() {
        if (game.turn !== 0 || game.phase !== 'draw') {
          if (game.turn === 0 && game.phase === 'play') {
            showToast('Zaten taş çektin! Per açabilir veya taş atabilirsin.', 'error');
          }
          return;
        }
        if (game.drawPile.length === 0) {
          finishRound(null, false);
          return;
        }
        const startXf = getDrawStackTopWorld();
        const tile = game.drawPile.pop();
        const slotIdx = addTileToHumanRack(tile);
        game.phase = 'play';
        game.tookSideTile = null;
        game.selectedTileId = tile.id;

        sound.playTileDraw();
        hiddenFlyingTileIds.add(tile.id);
        rebuildRackVisuals();
        rebuildDrawStackAndIndicator();
        updateHUD();

        const destXf = getRackSlotWorldTransform(slotIdx >= 0 ? slotIdx : 0);
        spawnFlyingTile({
          tile,
          startPos: startXf.pos,
          startQuat: startXf.quat,
          endPos: destXf.pos,
          endQuat: destXf.quat,
          startScale: 0.9,
          endScale: 1.0,
          arcHeight: 2.35,
          duration: 0.56,
          spinX: 0.3,
          spinY: Math.PI * 1.15,
          spinZ: 0.25,
          hideTargetId: tile.id,
          onComplete: () => {
            sound.playTileClack(1.16);
          },
        });
        showToast('Ortadan taş çektin.');
      }

      function humanDrawFromSide() {
        if (game.turn !== 0 || game.phase !== 'draw') {
          showToast('Yandan taş almak için sıranın başında olmalısın.', 'error');
          return;
        }
        const leftPile = game.discards[3];
        if (leftPile.length === 0) {
          sound.playError();
          showToast('Sol oyuncunun attığı taş yok.', 'error');
          return;
        }
        const startXf = getDiscardTopWorld(3, 0);
        const tile = leftPile.pop();
        const slotIdx = addTileToHumanRack(tile);
        game.phase = 'play';
        game.tookSideTile = tile;
        game.selectedTileId = tile.id;

        sound.playTileDraw();
        hiddenFlyingTileIds.add(tile.id);
        rebuildRackVisuals();
        rebuildDiscardPiles();
        updateHUD();

        const destXf = getRackSlotWorldTransform(slotIdx >= 0 ? slotIdx : 0);
        spawnFlyingTile({
          tile,
          startPos: startXf.pos,
          startQuat: startXf.quat,
          endPos: destXf.pos,
          endQuat: destXf.quat,
          startScale: 0.92,
          endScale: 1.0,
          arcHeight: 2.15,
          duration: 0.54,
          spinX: -0.25,
          spinY: -Math.PI * 0.9,
          spinZ: 0.35,
          hideTargetId: tile.id,
          onComplete: () => {
            sound.playTileClack(1.1);
          },
        });

        showToast(
          game.players[0].hasOpened
            ? 'Yandan taş aldın! Bu taşı bu turda kullanmalısın.'
            : 'Yandan taş aldın! Elini 101+ açıp bu taşı kullanmalısın.'
        );
      }

      function humanReturnSideTile() {
        if (game.turn !== 0 || game.phase !== 'play' || !game.tookSideTile) return;
        const rack = game.players[0].rack;
        const idx = rack.findIndex((t) => t && t.id === game.tookSideTile.id);
        if (idx === -1) return;

        const startXf = getRackSlotWorldTransform(idx);
        const tile = game.tookSideTile;
        rack[idx] = null;
        game.discards[3].push(tile);
        game.tookSideTile = null;
        game.phase = 'draw';
        game.selectedTileId = null;

        hiddenFlyingTileIds.add(tile.id);
        rebuildRackVisuals();
        rebuildDiscardPiles();
        updateHUD();

        const destXf = getDiscardTopWorld(3, 0);
        spawnFlyingTile({
          tile,
          startPos: startXf.pos,
          startQuat: startXf.quat,
          endPos: destXf.pos,
          endQuat: destXf.quat,
          startScale: 1.0,
          endScale: 0.9,
          arcHeight: 1.85,
          duration: 0.48,
          spinY: Math.PI,
          spinZ: -0.22,
          hideTargetId: tile.id,
          onComplete: () => {
            sound.playTileClack(0.9);
            spawnImpactRing(destXf.pos, 0x22d3ee, 0.9);
          },
        });
        showToast('Yandan alınan taş iade edildi. Ortadan çekebilirsin.');
      }

      function evaluateHumanOpenCandidate() {
        // If multi-selection has >= 3 tiles, evaluate selected tiles first
        if (game.multiSelectedIds.size >= 3) {
          const rack = game.players[0].rack;
          const selected = rack.filter((t) => t && game.multiSelectedIds.has(t.id));
          const direct = evaluateMeld(selected);
          if (direct) {
            return { melds: [direct], totalPoints: direct.points, source: 'selection' };
          }
          const solved = findBestMelds(selected);
          if (solved.melds.length > 0) {
            return { melds: solved.melds, totalPoints: solved.totalPoints, source: 'selection' };
          }
          return { melds: [], totalPoints: 0, source: 'selection' };
        }
        // Otherwise evaluate all valid contiguous groups on the 2-tier rack
        const groups = getHumanRackGroups();
        return { melds: groups.validMelds, totalPoints: groups.totalPoints, source: 'rack' };
      }

      function humanOpenMelds() {
        if (game.turn !== 0 || game.phase !== 'play') {
          sound.playError();
          showToast('El açmak için önce taş çekmelisin.', 'error');
          return;
        }

        const evalRes = evaluateHumanOpenCandidate();
        if (evalRes.melds.length === 0) {
          sound.playError();
          showToast('Istakada geçerli bir per bulunamadı. "Seri Diz" deneyebilirsin.', 'error');
          return;
        }

        const alreadyOpened = game.players[0].hasOpened;
        if (!alreadyOpened && evalRes.totalPoints < 101) {
          sound.playError();
          showToast(`101 barajı için en az 101 puan gerekli (Mevcut: ${evalRes.totalPoints}).`, 'error');
          return;
        }

        // Verify side tile usage if player took side tile and hasn't opened yet
        if (game.tookSideTile && !alreadyOpened) {
          const usedSide = evalRes.melds.some((m) => m.tiles.some((t) => t.id === game.tookSideTile.id));
          if (!usedSide) {
            sound.playError();
            showToast('Yandan aldığın taşı açtığın perlerden birinde kullanmalısın!', 'error');
            return;
          }
        }

        // Snapshot exact world start transforms on the human rack BEFORE removing tiles
        humanRackGroup.updateMatrixWorld(true);
        const startTransforms = new Map();
        const rack = game.players[0].rack;
        for (let i = 0; i < RACK_SLOTS; i++) {
          if (!rack[i]) continue;
          const rec = rackTileVisuals.get(rack[i].id);
          if (rec) {
            const p = new THREE.Vector3();
            const q = new THREE.Quaternion();
            rec.mesh.getWorldPosition(p);
            rec.mesh.getWorldQuaternion(q);
            startTransforms.set(rack[i].id, { pos: p, quat: q });
          } else {
            startTransforms.set(rack[i].id, getRackSlotWorldTransform(i));
          }
        }

        // Remove melded tiles from human rack & push onto 3D table
        const removeIds = new Set();
        const newlyOpenedMelds = [];
        evalRes.melds.forEach((m) => {
          m.tiles.forEach((t) => {
            removeIds.add(t.id);
            hiddenFlyingTileIds.add(t.id);
          });
          const entry = {
            ...m,
            id: game.nextMeldId++,
            owner: 0,
          };
          game.openMelds.push(entry);
          newlyOpenedMelds.push(entry);
        });

        for (let i = 0; i < RACK_SLOTS; i++) {
          if (rack[i] && removeIds.has(rack[i].id)) {
            rack[i] = null;
          }
        }

        if (game.tookSideTile && removeIds.has(game.tookSideTile.id)) {
          game.tookSideTile = null;
        }

        game.players[0].hasOpened = true;
        game.selectedTileId = null;
        game.multiSelectedIds.clear();
        game.multiSelectMode = false;

        sound.playOpenFanfare();
        rebuildRackVisuals();
        rebuildOpenMelds3D();
        updateHUD();

        // Briefly tilt camera wider toward center so player watches melds cascade into place
        centerFocusTimer = 1.45;

        // Launch sequential cascading parabolic flight for every tile in each opened meld!
        let staggerIdx = 0;
        newlyOpenedMelds.forEach((meld, mIdx) => {
          meld.tiles.forEach((tile) => {
            const startXf = startTransforms.get(tile.id) || getRackSlotWorldTransform(7);
            const destMesh = openMeldTileVisuals.get(tile.id);
            const endPos = new THREE.Vector3(0, 0.14, 0);
            if (destMesh) destMesh.getWorldPosition(endPos);

            const delay = staggerIdx * 0.062 + mIdx * 0.09;
            staggerIdx++;

            spawnFlyingTile({
              tile,
              startPos: startXf.pos,
              startQuat: startXf.quat,
              endPos,
              endQuat: _flatStandQuat,
              startScale: 1.0,
              endScale: 0.77,
              arcHeight: 2.05 + (mIdx % 2) * 0.25,
              duration: 0.48,
              delay,
              spinX: 0.2,
              spinY: Math.PI * 0.75,
              spinZ: 0.18,
              hideTargetId: tile.id,
              onComplete: () => {
                sound.playTileClack(1.06 + (staggerIdx % 4) * 0.04);
                spawnImpactRing(endPos, 0x34d399, 0.72);
              },
            });
          });
        });

        showToast(
          alreadyOpened
            ? `Yeni per masaya eklendi (+${evalRes.totalPoints} Puan)!`
            : `Harika! ${evalRes.totalPoints} puanla elini açtın!`,
          'success'
        );

        // If 0 tiles left after opening, instant victory!
        if (getHumanHandList().length === 0) {
          finishRound(0, false);
        }
      }

      function humanLayoffToSpecificMeld(meldId = null) {
        if (game.turn !== 0 || game.phase !== 'play') {
          sound.playError();
          showToast('İşlek eklemek için kendi turunda olmalısın.', 'error');
          return;
        }
        if (!game.players[0].hasOpened) {
          sound.playError();
          showToast('İşlek atabilmek için önce 101 ile elini açmalısın.', 'error');
          return;
        }
        if (game.openMelds.length === 0) {
          sound.playError();
          showToast('Masada henüz açık per yok.', 'error');
          return;
        }

        const rack = game.players[0].rack;
        const candidateTiles =
          game.selectedTileId !== null
            ? [rack.find((t) => t && t.id === game.selectedTileId)].filter(Boolean)
            : getHumanHandList();

        const targetMelds =
          meldId !== null ? game.openMelds.filter((m) => m.id === meldId) : game.openMelds;

        for (const tile of candidateTiles) {
          for (const meld of targetMelds) {
            const res = tryLayoffOnMeld(tile, meld);
            if (!res) continue;

            // Capture tile start transform before removing from rack
            const slotIdx = rack.findIndex((t) => t && t.id === tile.id);
            const startXf = getRackSlotWorldTransform(slotIdx);

            // Execute layoff!
            rack[slotIdx] = res.retrievedOkey ? res.retrievedOkey : null;

            if (game.tookSideTile && game.tookSideTile.id === tile.id) {
              game.tookSideTile = null;
            }

            Object.assign(meld, res.updatedMeld);
            game.selectedTileId = null;

            hiddenFlyingTileIds.add(tile.id);
            sound.playLayoff();
            rebuildRackVisuals();
            rebuildOpenMelds3D();
            updateHUD();

            const destMesh = openMeldTileVisuals.get(tile.id);
            const endPos = new THREE.Vector3(0, 0.14, 0);
            if (destMesh) destMesh.getWorldPosition(endPos);

            spawnFlyingTile({
              tile,
              startPos: startXf.pos,
              startQuat: startXf.quat,
              endPos,
              endQuat: _flatStandQuat,
              startScale: 1.0,
              endScale: 0.77,
              arcHeight: 1.9,
              duration: 0.46,
              spinY: Math.PI,
              spinZ: 0.2,
              hideTargetId: tile.id,
              onComplete: () => {
                sound.playTileClack(1.12);
                spawnImpactRing(endPos, 0x22d3ee, 0.85);
              },
            });

            showToast(
              res.retrievedOkey
                ? 'Okey taşını yerinden alıp eline geçirdin!'
                : 'Taş masadaki pere işlendi!',
              'success'
            );

            if (getHumanHandList().length === 0) {
              finishRound(0, false);
            }
            return;
          }
        }

        sound.playError();
        showToast(
          game.selectedTileId !== null
            ? 'Seçili taş bu pere işlenemiyor.'
            : 'Istakanda işlenebilir taş bulunamadı.',
          'error'
        );
      }

      function humanDiscardTile(tileId) {
        if (game.turn !== 0 || game.phase !== 'play') {
          sound.playError();
          showToast('Taş atmak için önce taş çekmelisin.', 'error');
          return;
        }
        if (tileId === null || tileId === undefined) {
          sound.playError();
          showToast('Atmak için önce ıstakadan bir taş seç.', 'error');
          return;
        }

        if (game.tookSideTile) {
          sound.playError();
          showToast(
            'Yandan aldığın taşı kullanmadan turu bitiremezsin! El aç veya "Yandan İade Et".',
            'error'
          );
          return;
        }

        const rack = game.players[0].rack;
        const slot = rack.findIndex((t) => t && t.id === tileId);
        if (slot === -1) return;

        // Capture exact current world transform (whether sitting on rack or dragged mid-air)
        humanRackGroup.updateMatrixWorld(true);
        const startPos = new THREE.Vector3();
        const startQuat = new THREE.Quaternion();
        const rec = rackTileVisuals.get(tileId);
        if (rec) {
          rec.mesh.getWorldPosition(startPos);
          rec.mesh.getWorldQuaternion(startQuat);
        } else {
          const fallback = getRackSlotWorldTransform(slot);
          startPos.copy(fallback.pos);
          startQuat.copy(fallback.quat);
        }

        const tile = rack[slot];
        rack[slot] = null;
        game.discards[0].push(tile);
        game.selectedTileId = null;
        game.multiSelectedIds.clear();

        hiddenFlyingTileIds.add(tile.id);
        rebuildRackVisuals();
        rebuildDiscardPiles();

        const destXf = getDiscardTopWorld(0, 0);
        spawnFlyingTile({
          tile,
          startPos,
          startQuat,
          endPos: destXf.pos,
          endQuat: destXf.quat,
          startScale: 1.0,
          endScale: 0.9,
          arcHeight: 2.25,
          duration: 0.5,
          spinX: 0.35,
          spinY: Math.PI * 1.45,
          spinZ: -0.3,
          hideTargetId: tile.id,
          onComplete: () => {
            sound.playTileClack(0.84);
            spawnImpactRing(destXf.pos, 0xf3d06b, 1.15);
          },
        });

        // Check win!
        if (getHumanHandList().length === 0) {
          finishRound(0, isRealOkey(tile));
          return;
        }

        if (game.drawPile.length === 0) {
          finishRound(null, false);
          return;
        }

        advanceTurn();
      }

      function sortHumanRackBySeries(silent = false) {
        const hand = getHumanHandList();
        const best = findBestMelds(hand);
        const usedIds = new Set();
        const nextRack = new Array(RACK_SLOTS).fill(null);

        let cursor = 0;
        for (const meld of best.melds) {
          const len = meld.tiles.length;
          // Keep each meld together on a single row if possible
          const rowEnd = cursor < 14 ? 14 : 28;
          if (cursor + len > rowEnd && cursor < 14) {
            cursor = 14;
          }
          if (cursor + len <= RACK_SLOTS) {
            meld.tiles.forEach((t) => {
              nextRack[cursor++] = t;
              usedIds.add(t.id);
            });
            // Leave a 1-slot gap between distinct melds so contiguous group detector sees them cleanly!
            if (cursor < RACK_SLOTS && cursor !== 14) cursor++;
          }
        }

        // Remaining tiles sorted by color & number
        const leftover = hand
          .filter((t) => !usedIds.has(t.id))
          .sort((a, b) => {
            if (isRealOkey(a) !== isRealOkey(b)) return isRealOkey(a) ? 1 : -1;
            const ea = getEffectiveTile(a);
            const eb = getEffectiveTile(b);
            const cDiff = COLORS.indexOf(ea.color) - COLORS.indexOf(eb.color);
            return cDiff !== 0 ? cDiff : ea.num - eb.num;
          });

        // Place leftovers starting after current cursor, wrapping into empty slots if needed
        for (const t of leftover) {
          while (cursor < RACK_SLOTS && nextRack[cursor] !== null) cursor++;
          if (cursor < RACK_SLOTS) {
            nextRack[cursor++] = t;
          } else {
            const empty = nextRack.findIndex((s) => s === null);
            if (empty !== -1) nextRack[empty] = t;
          }
        }

        game.players[0].rack = nextRack;
        game.selectedTileId = null;
        game.multiSelectedIds.clear();

        if (!silent) {
          sound.playTileClack(1.15);
          rebuildRackVisuals();
          updateHUD();
        }
      }

      function sortHumanRackByPairs() {
        const hand = getHumanHandList();
        const buckets = new Map();
        const okeys = [];

        for (const t of hand) {
          if (isRealOkey(t)) {
            okeys.push(t);
            continue;
          }
          const eff = getEffectiveTile(t);
          const key = `${eff.color}-${eff.num}`;
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(t);
        }

        const pairs = [];
        const singles = [];
        for (const arr of buckets.values()) {
          if (arr.length >= 2) pairs.push(arr);
          else singles.push(arr[0]);
        }

        pairs.sort((a, b) => getEffectiveTile(b[0]).num - getEffectiveTile(a[0]).num);
        singles.sort((a, b) => getEffectiveTile(b).num - getEffectiveTile(a).num);

        // Pair any okeys with highest singles
        while (okeys.length > 0 && singles.length > 0) {
          pairs.push([singles.shift(), okeys.shift()]);
        }
        while (okeys.length > 0) singles.push(okeys.shift());

        const nextRack = new Array(RACK_SLOTS).fill(null);
        let cursor = 0;

        for (const pr of pairs) {
          const rowEnd = cursor < 14 ? 14 : 28;
          if (cursor + pr.length > rowEnd && cursor < 14) cursor = 14;
          if (cursor + pr.length <= RACK_SLOTS) {
            pr.forEach((t) => (nextRack[cursor++] = t));
            if (cursor < RACK_SLOTS && cursor !== 14) cursor++;
          } else {
            pr.forEach((t) => singles.push(t));
          }
        }

        for (const t of singles) {
          while (cursor < RACK_SLOTS && nextRack[cursor] !== null) cursor++;
          if (cursor < RACK_SLOTS) nextRack[cursor++] = t;
          else {
            const e = nextRack.findIndex((s) => s === null);
            if (e !== -1) nextRack[e] = t;
          }
        }

        game.players[0].rack = nextRack;
        game.selectedTileId = null;
        game.multiSelectedIds.clear();
        sound.playTileClack(1.06);
        rebuildRackVisuals();
        updateHUD();
        showToast(`Çift dizildi (${pairs.length} çift bulundu).`);
      }

      /* ------------------ AI BOT INTELLIGENCE ------------------ */
      function advanceTurn() {
        game.turn = (game.turn + 1) % 4;
        if (game.turn === 0) {
          game.phase = 'draw';
          updateHUD();
          sound.playTurnNotify();
        } else {
          game.phase = 'bot';
          updateHUD();
          scheduleBotTurn();
        }
      }

      function scheduleBotTurn() {
        clearAllBotTimers();
        game.botTimer = setTimeout(executeBotTurn, 680);
      }

      function executeBotTurn() {
        if (game.phase === 'ended') return;
        const pIdx = game.turn;
        const bot = game.players[pIdx];
        const prevIdx = (pIdx + 3) % 4;
        const sidePile = game.discards[prevIdx];
        const botXf = getBotRackWorld(pIdx);

        // 1. Draw step (with parabolic flight into bot's rack)
        if (bot.hand.length % 3 === 0 || bot.hand.length <= 21) {
          let tookSide = false;
          if (sidePile.length > 0 && !bot.hasOpened) {
            const topSide = sidePile[sidePile.length - 1];
            const sim = findBestMelds([...bot.hand, topSide]);
            const usesSide = sim.melds.some((m) => m.tiles.some((t) => t.id === topSide.id));
            if (sim.totalPoints >= 101 && usesSide) {
              const startXf = getDiscardTopWorld(prevIdx, 0);
              const drawn = sidePile.pop();
              bot.hand.push(drawn);
              tookSide = true;
              sound.playTileDraw();
              spawnFlyingTile({
                tile: drawn,
                startPos: startXf.pos,
                startQuat: startXf.quat,
                endPos: botXf.pos,
                endQuat: botXf.quat,
                startScale: 0.85,
                endScale: 0.6,
                arcHeight: 1.9,
                duration: 0.42,
                spinY: Math.PI,
                faceDown: false,
              });
            }
          }
          if (!tookSide) {
            if (game.drawPile.length === 0) {
              finishRound(null, false);
              return;
            }
            const startXf = getDrawStackTopWorld();
            const drawn = game.drawPile.pop();
            bot.hand.push(drawn);
            sound.playTileDraw();
            spawnFlyingTile({
              tile: drawn,
              startPos: startXf.pos,
              startQuat: startXf.quat,
              endPos: botXf.pos,
              endQuat: botXf.quat,
              startScale: 0.85,
              endScale: 0.58,
              arcHeight: 2.0,
              duration: 0.42,
              spinY: Math.PI,
              faceDown: true,
            });
          }
        }

        rebuildDrawStackAndIndicator();
        rebuildDiscardPiles();
        rebuildBotRacks();

        // Pause briefly for draw flight, then meld & discard with parabolic animations
        const step2Timer = setTimeout(() => {
          if (game.phase === 'ended' || game.turn !== pIdx) return;

          // 2. Meld / Open step
          const best = findBestMelds(bot.hand);
          if (!bot.hasOpened && best.totalPoints >= 101) {
            const usedIds = new Set();
            const newlyOpened = [];
            best.melds.forEach((m) => {
              m.tiles.forEach((t) => {
                usedIds.add(t.id);
                hiddenFlyingTileIds.add(t.id);
              });
              const entry = { ...m, id: game.nextMeldId++, owner: pIdx };
              game.openMelds.push(entry);
              newlyOpened.push(entry);
            });
            bot.hand = bot.hand.filter((t) => !usedIds.has(t.id));
            bot.hasOpened = true;
            sound.playOpenFanfare();
            rebuildOpenMelds3D();
            rebuildBotRacks();
            showToast(`${bot.name}, ${best.totalPoints} puanla elini açtı!`, 'success');

            let idxCounter = 0;
            newlyOpened.forEach((meld) => {
              meld.tiles.forEach((tile) => {
                const destMesh = openMeldTileVisuals.get(tile.id);
                const endPos = new THREE.Vector3(0, 0.14, 0);
                if (destMesh) destMesh.getWorldPosition(endPos);
                const delay = idxCounter * 0.05;
                idxCounter++;
                spawnFlyingTile({
                  tile,
                  startPos: botXf.pos,
                  startQuat: botXf.quat,
                  endPos,
                  endQuat: _flatStandQuat,
                  startScale: 0.65,
                  endScale: 0.77,
                  arcHeight: 1.9,
                  duration: 0.44,
                  delay,
                  spinY: Math.PI * 0.8,
                  hideTargetId: tile.id,
                  onComplete: () => {
                    spawnImpactRing(endPos, 0x34d399, 0.68);
                  },
                });
              });
            });

            if (bot.hand.length === 0) {
              finishRound(pIdx, false);
              return;
            }
          } else if (bot.hasOpened) {
            if (best.melds.length > 0) {
              const usedIds = new Set();
              const newlyOpened = [];
              best.melds.forEach((m) => {
                m.tiles.forEach((t) => {
                  usedIds.add(t.id);
                  hiddenFlyingTileIds.add(t.id);
                });
                const entry = { ...m, id: game.nextMeldId++, owner: pIdx };
                game.openMelds.push(entry);
                newlyOpened.push(entry);
              });
              bot.hand = bot.hand.filter((t) => !usedIds.has(t.id));
              sound.playLayoff();
              rebuildOpenMelds3D();
              let idxCounter = 0;
              newlyOpened.forEach((meld) => {
                meld.tiles.forEach((tile) => {
                  const destMesh = openMeldTileVisuals.get(tile.id);
                  const endPos = new THREE.Vector3(0, 0.14, 0);
                  if (destMesh) destMesh.getWorldPosition(endPos);
                  spawnFlyingTile({
                    tile,
                    startPos: botXf.pos,
                    startQuat: botXf.quat,
                    endPos,
                    endQuat: _flatStandQuat,
                    startScale: 0.65,
                    endScale: 0.77,
                    arcHeight: 1.85,
                    duration: 0.42,
                    delay: idxCounter++ * 0.05,
                    spinY: Math.PI * 0.8,
                    hideTargetId: tile.id,
                    onComplete: () => spawnImpactRing(endPos, 0x22d3ee, 0.68),
                  });
                });
              });
              if (bot.hand.length === 0) {
                finishRound(pIdx, false);
                return;
              }
            }

            // Try laying off single tiles ("işlek") onto existing open melds
            let laidOffAny = true;
            while (laidOffAny && bot.hand.length > 1) {
              laidOffAny = false;
              for (let i = 0; i < bot.hand.length; i++) {
                const t = bot.hand[i];
                for (const meld of game.openMelds) {
                  const res = tryLayoffOnMeld(t, meld);
                  if (res) {
                    if (res.retrievedOkey) bot.hand[i] = res.retrievedOkey;
                    else bot.hand.splice(i, 1);
                    Object.assign(meld, res.updatedMeld);
                    laidOffAny = true;
                    sound.playLayoff();
                    rebuildOpenMelds3D();
                    break;
                  }
                }
                if (laidOffAny) break;
              }
            }
          }

          // 3. Smart Discard step
          const postBest = findBestMelds(bot.hand);
          const keepIds = new Set();
          postBest.melds.forEach((m) => m.tiles.forEach((t) => keepIds.add(t.id)));

          let discardIdx = 0;
          let worstScore = -Infinity;

          for (let i = 0; i < bot.hand.length; i++) {
            const t = bot.hand[i];
            if (bot.hand.length === 1) {
              discardIdx = 0;
              break;
            }
            if (isRealOkey(t)) continue;

            const eff = getEffectiveTile(t);
            let utility = eff.num;
            if (keepIds.has(t.id)) utility -= 40;

            for (let j = 0; j < bot.hand.length; j++) {
              if (i === j) continue;
              const o = bot.hand[j];
              if (isRealOkey(o)) continue;
              const oe = getEffectiveTile(o);
              if (oe.color === eff.color && Math.abs(oe.num - eff.num) <= 2) utility -= 8;
              if (oe.num === eff.num && oe.color !== eff.color) utility -= 7;
            }

            if (utility > worstScore) {
              worstScore = utility;
              discardIdx = i;
            }
          }

          const discarded = bot.hand.splice(discardIdx, 1)[0];
          game.discards[pIdx].push(discarded);
          hiddenFlyingTileIds.add(discarded.id);
          rebuildBotRacks();
          rebuildDiscardPiles();

          const destXf = getDiscardTopWorld(pIdx, 0);
          spawnFlyingTile({
            tile: discarded,
            startPos: botXf.pos,
            startQuat: botXf.quat,
            endPos: destXf.pos,
            endQuat: destXf.quat,
            startScale: 0.72,
            endScale: 0.9,
            arcHeight: 1.95,
            duration: 0.45,
            spinY: Math.PI * 1.25,
            spinZ: 0.25,
            hideTargetId: discarded.id,
            onComplete: () => {
              sound.playTileClack(0.92 + pIdx * 0.04);
              spawnImpactRing(destXf.pos, pIdx === 3 ? 0x22d3ee : 0xf3d06b, 0.95);
            },
          });

          if (bot.hand.length === 0) {
            finishRound(pIdx, isRealOkey(discarded));
            return;
          }

          if (game.drawPile.length === 0) {
            finishRound(null, false);
            return;
          }

          const nextTimer = setTimeout(() => {
            if (game.phase !== 'ended' && game.turn === pIdx) {
              advanceTurn();
            }
          }, 430);
          game.botTimers.push(nextTimer);
        }, 380);
        game.botTimers.push(step2Timer);
      }

      /* ------------------ ROUND END SCORING & LOCALSTORAGE REWARD ------------------ */
      function finishRound(winnerIdx, wonByOkey) {
        clearAllBotTimers();
        game.phase = 'ended';

        const rows = game.players.map((p, idx) => {
          const hand = idx === 0 ? getHumanHandList() : p.hand;
          let penalty = 0;
          if (idx === winnerIdx) {
            penalty = wonByOkey ? -202 : -101;
          } else if (!p.hasOpened) {
            penalty = 202;
          } else {
            penalty = hand.reduce((acc, t) => acc + getTilePenaltyValue(t), 0);
          }
          return { idx, name: p.name, hasOpened: p.hasOpened, leftCount: hand.length, penalty };
        });

        // If draw pile ran out (no one emptied hand), lowest penalty wins!
        let resolvedWinner = winnerIdx;
        if (resolvedWinner === null) {
          const sorted = rows.slice().sort((a, b) => a.penalty - b.penalty);
          resolvedWinner = sorted[0].idx;
        }

        const humanWon = resolvedWinner === 0;
        const deltaChips = humanWon
          ? Math.round(tableStake * (wonByOkey ? 5.0 : 3.6))
          : -Math.min(playerChips, tableStake);

        playerChips = Math.max(0, playerChips + deltaChips);
        saveSharedChips(playerChips, humanWon);

        if (humanWon) sound.playWin();
        else sound.playError();

        document.getElementById('modal-kicker').textContent = `EL ${game.round} SONUCU`;
        document.getElementById('modal-title').textContent = humanWon
          ? wonByOkey
            ? 'Okey Atarak Kazandın!'
            : 'Eli Kazandın!'
          : `${game.players[resolvedWinner].name} Eli Kazandı`;
        document.getElementById('modal-sub').textContent =
          winnerIdx === null
            ? 'Ortadaki taşlar tükendi. En düşük ceza puanına sahip oyuncu kazandı.'
            : wonByOkey
              ? 'Okey taşı atılarak bitildi — çift ödül uygulandı!'
              : 'Tüm taşlarını bitiren oyuncu masanın ödülünü aldı.';

        const tbody = document.getElementById('modal-tbody');
        tbody.innerHTML = rows
          .map(
            (r) => `
              <tr class="${r.idx === resolvedWinner ? 'winner-row' : ''}">
                <td>${r.name}${r.idx === resolvedWinner ? ' ★' : ''}</td>
                <td>${r.hasOpened ? '101 Açtı' : 'Açmadı'}</td>
                <td class="num">${r.leftCount}</td>
                <td class="num">${r.penalty}</td>
              </tr>
            `
          )
          .join('');

        const rewardEl = document.getElementById('modal-reward');
        rewardEl.textContent = `${deltaChips >= 0 ? '+' : ''}${fmt(deltaChips)} Çip`;
        rewardEl.className = `reward-amount ${deltaChips >= 0 ? 'pos' : 'neg'}`;

        document.getElementById('round-modal').classList.add('open');
        updateHUD();
      }

      /* =========================================================================
       * 6. HUD UPDATERS & BUTTON BINDINGS
       * ========================================================================= */
      function renderMiniTile(el, color, num) {
        const hex = COLOR_HEX[color] || '#0f172a';
        el.innerHTML = `<span style="color:${hex}">${num}</span><span class="dot" style="background:${hex}"></span>`;
      }

      function updateIndicatorHUD() {
        if (!game.indicatorTile) return;
        renderMiniTile(
          document.getElementById('hud-indicator'),
          game.indicatorTile.color,
          game.indicatorTile.number
        );
        renderMiniTile(document.getElementById('hud-okey'), game.okeyColor, game.okeyNumber);
      }

      function updateHUD() {
        // Players top strip
        const strip = document.getElementById('players-strip');
        strip.innerHTML = game.players
          .map((p, idx) => {
            const count = idx === 0 ? getHumanHandList().length : p.hand.length;
            const active = game.turn === idx && game.phase !== 'ended';
            return `
              <div class="player-box ${active ? 'active-turn' : ''}">
                <span class="player-name">${p.name}</span>
                <span class="player-meta">${count} taş</span>
                <span class="player-status ${p.hasOpened ? 'opened' : 'closed'}">
                  ${p.hasOpened ? '101 Açtı' : 'Açmadı'}
                </span>
              </div>
            `;
          })
          .join('');

        // Turn banner
        const banner = document.getElementById('turn-banner');
        if (game.phase === 'ended') {
          banner.textContent = 'El tamamlandı.';
          banner.className = 'turn-banner';
        } else if (game.turn === 0) {
          banner.className = 'turn-banner highlight';
          if (game.phase === 'draw') {
            banner.textContent = 'Sıra Sende — Ortadan taş çek veya sol oyuncunun taşını (Yandan Al) al';
          } else if (game.tookSideTile) {
            banner.textContent = 'Yandan Taş Aldın — 101+ Per Aç veya "Yandan İade Et"';
          } else {
            banner.textContent = 'Sıra Sende — Taşlarını diz, 101+ el aç veya sağa bir taş at';
          }
        } else {
          banner.className = 'turn-banner';
          banner.textContent = `${game.players[game.turn].name} hamle yapıyor...`;
        }

        // Live valid meld score & rack glow indicators
        const evalRes = evaluateHumanOpenCandidate();
        const scoreEl = document.getElementById('live-meld-score');
        const openBtn = document.getElementById('btn-open-melds');
        const openText = document.getElementById('open-btn-text');

        if (game.players[0].hasOpened) {
          openText.textContent = 'Yeni Per Aç';
          scoreEl.textContent = `${evalRes.totalPoints} Puan`;
        } else {
          openText.textContent = game.multiSelectedIds.size >= 3 ? 'Seçili Perleri Aç' : 'El Aç (101+)';
          scoreEl.textContent = `${evalRes.totalPoints} / 101`;
        }

        const canDraw = game.turn === 0 && game.phase === 'draw';
        const canPlay = game.turn === 0 && game.phase === 'play';
        const canOpen =
          canPlay &&
          evalRes.melds.length > 0 &&
          (game.players[0].hasOpened || evalRes.totalPoints >= 101);

        document.getElementById('btn-draw-center').disabled = !canDraw || game.drawPile.length === 0;
        document.getElementById('btn-draw-side').disabled = !canDraw || game.discards[3].length === 0;
        document.getElementById('btn-return-side').style.display =
          canPlay && game.tookSideTile ? 'inline-flex' : 'none';
        openBtn.disabled = !canOpen;
        document.getElementById('btn-layoff').disabled =
          !canPlay || !game.players[0].hasOpened || game.openMelds.length === 0;
        document.getElementById('btn-discard').disabled =
          !canPlay || game.selectedTileId === null || Boolean(game.tookSideTile);

        const msBtn = document.getElementById('btn-multiselect');
        msBtn.classList.toggle('active-mode', game.multiSelectMode);
        msBtn.textContent =
          game.multiSelectedIds.size > 0 ? `Per Seç (${game.multiSelectedIds.size})` : 'Per Seç';

        // Update subtle rack slot glow bars under valid contiguous melds
        const validSlots = new Set();
        getHumanRackGroups().validMelds.forEach((m) => m.slotIndices.forEach((s) => validSlots.add(s)));
        for (let i = 0; i < RACK_SLOTS; i++) {
          const mat = slotGlowMeshes[i].material;
          if (dragState && dragState.active && dragState.targetSlot === i) {
            mat.color.setHex(0x22d3ee);
            mat.opacity = 0.92;
          } else if (validSlots.has(i)) {
            mat.color.setHex(evalRes.totalPoints >= 101 || game.players[0].hasOpened ? 0x34d399 : 0xf3d06b);
            mat.opacity = 0.72;
          } else {
            mat.opacity = 0;
          }
        }
      }

      // Bind DOM buttons
      document.getElementById('btn-draw-center').addEventListener('click', humanDrawFromCenter);
      document.getElementById('btn-draw-side').addEventListener('click', humanDrawFromSide);
      document.getElementById('btn-return-side').addEventListener('click', humanReturnSideTile);
      document.getElementById('btn-open-melds').addEventListener('click', humanOpenMelds);
      document.getElementById('btn-layoff').addEventListener('click', () => humanLayoffToSpecificMeld(null));
      document.getElementById('btn-discard').addEventListener('click', () => humanDiscardTile(game.selectedTileId));
      document.getElementById('btn-sort-series').addEventListener('click', () => sortHumanRackBySeries(false));
      document.getElementById('btn-sort-pairs').addEventListener('click', sortHumanRackByPairs);

      document.getElementById('btn-multiselect').addEventListener('click', () => {
        game.multiSelectMode = !game.multiSelectMode;
        if (!game.multiSelectMode) game.multiSelectedIds.clear();
        sound.playTileClack(1.12);
        updateHUD();
      });

      document.getElementById('btn-next-round').addEventListener('click', () => {
        game.round++;
        game.dealer = (game.dealer + 1) % 4;
        startNewRound();
      });

      function syncSoundUI() {
        document.getElementById('ico-sound-on').style.display = sound.enabled ? 'block' : 'none';
        document.getElementById('ico-sound-off').style.display = sound.enabled ? 'none' : 'block';
        document.getElementById('sound-label').textContent = sound.enabled ? 'Ses' : 'Sessiz';
      }
      syncSoundUI();

      document.getElementById('btn-sound').addEventListener('click', () => {
        sound.enabled = !sound.enabled;
        syncSoundUI();
        if (sound.enabled) sound.playTileClack(1.1);
      });

      function toggleCameraMode() {
        const order = ['auto', 'rack', 'overview'];
        const labels = {
          auto: 'Dinamik Kamera',
          rack: 'Istaka Odak',
          overview: 'Geniş Masa',
        };
        cameraMode = order[(order.indexOf(cameraMode) + 1) % order.length];
        document.getElementById('cam-label').textContent = labels[cameraMode];
        sound.playTileClack(1.16);
      }

      document.getElementById('btn-cam').addEventListener('click', toggleCameraMode);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'v' || e.key === 'V') toggleCameraMode();
      });

      /* =========================================================================
       * 7. ANIMATION LOOP (PARABOLIC FLIGHTS, IMPACT FX, DYNAMIC CAMERA & PACING)
       * ========================================================================= */
      const clock = new THREE.Clock();
      const _desiredCamPos = new THREE.Vector3();
      const _desiredCamLook = new THREE.Vector3();
      let frameId = 0;
      let contextLost = false;

      function afterDraw(cb) {
        const gl = renderer.getContext();
        if (gl && typeof gl.fenceSync === 'function') {
          const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
          gl.flush();
          const poll = () => {
            const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
            if (state === gl.UNSIGNALED) frameId = window.setTimeout(poll, 5);
            else {
              if (sync) gl.deleteSync(sync);
              frameId = window.setTimeout(cb, 80);
            }
          };
          frameId = window.setTimeout(poll, 5);
        } else {
          frameId = window.setTimeout(cb, 80);
        }
      }

      let pageHidden = document.hidden;

      function tick() {
        if (contextLost || pageHidden) return;
        const dt = Math.min(clock.getDelta(), 0.1);

        // 1. Update parabolic flying tile animations
        for (let i = activeFlights.length - 1; i >= 0; i--) {
          const f = activeFlights[i];
          if (f.delay > 0) {
            f.delay -= dt;
            if (f.delay <= 0) {
              f.mesh.visible = true;
            }
            continue;
          }
          f.mesh.visible = true;
          f.elapsed += dt;
          const rawP = Math.min(1, f.elapsed / f.duration);
          // Smooth ease-in-out cubic for graceful take-off and crisp tactile settle
          const p = rawP < 0.5 ? 4 * rawP * rawP * rawP : 1 - Math.pow(-2 * rawP + 2, 3) / 2;

          // Parabolic arc interpolation
          _tmpVec.lerpVectors(f.startPos, f.endPos, p);
          const arcY = 4 * rawP * (1 - rawP) * f.arcHeight;
          _tmpVec.y += arcY;
          f.mesh.position.copy(_tmpVec);

          // Slerp base orientation + smooth mid-air spin envelope (peaks at mid-flight, 0 at start & end)
          _tmpQuat.slerpQuaternions(f.startQuat, f.endQuat, p);
          const spinEnv = Math.sin(rawP * Math.PI);
          _spinEuler.set(f.spinX * spinEnv, f.spinY * spinEnv, f.spinZ * spinEnv);
          _spinQuat.setFromEuler(_spinEuler);
          f.mesh.quaternion.copy(_tmpQuat).multiply(_spinQuat);

          const sc = THREE.MathUtils.lerp(f.startScale, f.endScale, p);
          f.mesh.scale.setScalar(sc);

          if (rawP >= 1) {
            flightGroup.remove(f.mesh);
            activeFlights.splice(i, 1);
            if (f.hideTargetId !== null) {
              revealTileVisual(f.hideTargetId);
            }
            if (typeof f.onComplete === 'function') {
              f.onComplete();
            }
          }
        }

        // 2. Update touchdown dust & golden light ring effects
        for (let i = impactEffects.length - 1; i >= 0; i--) {
          const fx = impactEffects[i];
          fx.elapsed += dt;
          const p = Math.min(1, fx.elapsed / fx.duration);
          const easeOut = 1 - Math.pow(1 - p, 3);

          const ringScale = 0.55 + easeOut * 2.35;
          fx.ring.scale.setScalar(ringScale);
          fx.ringMat.opacity = (1 - p) * 0.9;

          const posAttr = fx.dustGeo.attributes.position;
          for (let k = 0; k < fx.vels.length; k++) {
            const v = fx.vels[k];
            const nx = posAttr.getX(k) + v.vx * dt;
            const ny = Math.max(0.02, posAttr.getY(k) + v.vy * dt);
            const nz = posAttr.getZ(k) + v.vz * dt;
            v.vy -= 1.65 * dt;
            posAttr.setXYZ(k, nx, ny, nz);
          }
          posAttr.needsUpdate = true;
          fx.dustMat.opacity = (1 - p) * 0.85;

          if (p >= 1) {
            flightGroup.remove(fx.group);
            fx.ring.geometry.dispose();
            fx.ringMat.dispose();
            fx.dustGeo.dispose();
            fx.dustMat.dispose();
            impactEffects.splice(i, 1);
          }
        }

        // 3. Dynamic turn-aware camera framing (adaptive to viewport aspect ratio)
        if (centerFocusTimer > 0) centerFocusTimer = Math.max(0, centerFocusTimer - dt);
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        const narrowBoost = aspect < 1.5 ? (1.5 - aspect) * 4.4 : 0;

        if (cameraMode === 'overview') {
          _desiredCamPos.set(0, 12.6 + narrowBoost * 0.7, 7.6 + narrowBoost * 0.6);
          _desiredCamLook.set(0, 0, 0.25);
        } else if (cameraMode === 'rack') {
          _desiredCamPos.set(0, 7.05 + narrowBoost * 0.52, 9.95 + narrowBoost * 0.82);
          _desiredCamLook.set(0, 0.36, 1.92);
        } else {
          // Automatic Dinamik Kamera:
          // - Human turn: intimate focus on the lacquered walnut ıstaka (slightly wider during draw or meld cascade)
          // - Bot turns: cinematic wide table overview gently tracking active bot side
          if (game.turn === 0 && game.phase !== 'ended') {
            if (centerFocusTimer > 0) {
              _desiredCamPos.set(0, 10.2 + narrowBoost * 0.6, 9.2 + narrowBoost * 0.65);
              _desiredCamLook.set(0, 0.08, 0.45);
            } else if (game.phase === 'draw') {
              _desiredCamPos.set(0, 7.85 + narrowBoost * 0.55, 10.6 + narrowBoost * 0.85);
              _desiredCamLook.set(0, 0.22, 1.38);
            } else {
              _desiredCamPos.set(0, 7.12 + narrowBoost * 0.52, 10.05 + narrowBoost * 0.82);
              _desiredCamLook.set(0, 0.34, 1.86);
            }
          } else {
            const botPanX = game.turn === 1 ? 0.65 : game.turn === 3 ? -0.65 : 0;
            const botLookX = game.turn === 1 ? 0.45 : game.turn === 3 ? -0.45 : 0;
            _desiredCamPos.set(botPanX, 11.45 + narrowBoost * 0.68, 8.65 + narrowBoost * 0.58);
            _desiredCamLook.set(botLookX, 0.05, -0.2);
          }
        }

        const camEase = 1 - Math.exp(-3.6 * dt);
        camPosCurrent.lerp(_desiredCamPos, camEase);
        camLookCurrent.lerp(_desiredCamLook, camEase);
        camera.position.copy(camPosCurrent);
        camera.lookAt(camLookCurrent);

        // 4. Smoothly damp all rack tiles toward their slot / selection / hover positions
        for (const [id, rec] of rackTileVisuals.entries()) {
          if (dragState && dragState.active && dragState.tileId === id) continue;

          const isSelected = game.selectedTileId === id || game.multiSelectedIds.has(id);
          const isHovered = hoveredTileId === id;
          const liftY = isSelected ? 0.24 : isHovered ? 0.09 : 0;
          const liftZ = isSelected ? 0.18 : isHovered ? 0.06 : 0;

          rec.mesh.position.x = THREE.MathUtils.damp(rec.mesh.position.x, rec.targetPos.x, 14, dt);
          rec.mesh.position.y = THREE.MathUtils.damp(rec.mesh.position.y, rec.targetPos.y + liftY, 14, dt);
          rec.mesh.position.z = THREE.MathUtils.damp(rec.mesh.position.z, rec.targetPos.z + liftZ, 14, dt);
        }

        // 5. Animate unmistakable neon green active-turn light ring around the active player's rack
        const elapsed = clock.elapsedTime;
        const neonPulse = 0.84 + Math.sin(elapsed * 3.8) * 0.16;
        for (let p = 0; p < 4; p++) {
          const entry = rackTurnRings[p];
          const isActiveTurn = game.phase !== 'ended' && game.turn === p;
          entry.primary.level = THREE.MathUtils.damp(entry.primary.level, isActiveTurn ? 1.0 : 0.0, 8.0, dt);
          const lv = entry.primary.level;
          const visible = lv > 0.008;

          entry.primary.group.visible = visible;
          if (visible) {
            entry.primary.coreMat.opacity = lv * (0.94 * neonPulse);
            entry.primary.outerMat.opacity = lv * (0.36 * neonPulse);
            entry.primary.haloMat.opacity = lv * (0.64 * neonPulse);
            const scaleBreath = 1 + (1 - neonPulse) * 0.014;
            entry.primary.outerTube.scale.set(scaleBreath, scaleBreath, 1);
          }

          if (entry.base) {
            entry.base.group.visible = visible;
            if (visible) {
              entry.base.coreMat.opacity = lv * (0.85 * neonPulse);
              entry.base.outerMat.opacity = lv * (0.32 * neonPulse);
              entry.base.haloMat.opacity = lv * (0.62 * neonPulse);
            }
          }

          if (isActiveTurn) {
            activeTurnLight.position.lerp(entry.lightPos, 1 - Math.exp(-8 * dt));
            activeTurnLight.intensity = THREE.MathUtils.damp(activeTurnLight.intensity, 1.35 * neonPulse, 8.0, dt);
          }
        }
        if (game.phase === 'ended') {
          activeTurnLight.intensity = THREE.MathUtils.damp(activeTurnLight.intensity, 0, 8.0, dt);
        }

        // Pulse drag highlight gently on discard pad when dragging a tile
        const discardPadMat = discardHolders[0].pad.material;
        discardPadMat.opacity = dragState && dragState.overDiscard ? 0.65 : game.turn === 0 && game.phase === 'play' ? 0.28 : 0.14;

        const sidePadMat = discardHolders[3].pad.material;
        sidePadMat.opacity =
          game.turn === 0 && game.phase === 'draw' && game.discards[3].length > 0 ? 0.48 : 0.16;

        renderer.render(scene, camera);

        if (isSoftwareGl) afterDraw(tick);
        else frameId = requestAnimationFrame(tick);
      }

      function syncViewportSize() {
        const { w, h } = getSafeViewportSize();
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
        renderer.setSize(w, h);
      }

      window.addEventListener('resize', syncViewportSize);

      document.addEventListener('visibilitychange', () => {
        pageHidden = document.hidden;
        cancelAnimationFrame(frameId);
        clearTimeout(frameId);
        frameId = 0;
        if (!pageHidden && !contextLost) {
          syncViewportSize();
          clock.getDelta();
          tick();
        }
      });

      renderer.domElement.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        contextLost = true;
        cancelAnimationFrame(frameId);
        clearTimeout(frameId);
        frameId = 0;
      });

      renderer.domElement.addEventListener('webglcontextrestored', () => {
        contextLost = false;
        syncViewportSize();
        clock.getDelta();
        if (!pageHidden) tick();
      });

      // Kick off Round 1!
      startNewRound();
      syncViewportSize();
      requestAnimationFrame(syncViewportSize);
      if (!isSoftwareGl) renderer.compile(scene, camera);
      tick();
      })();
    </script>
  </body>
